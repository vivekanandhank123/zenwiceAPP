/* ============ timesheet ============ */
const dayKey=ms=>{const d=new Date(ms+SG);return d.toISOString().slice(0,10);};
function dayWorkMs(uid,day){const dd=S.time[uid]?.days?.[day];if(!dd)return 0;let ms=0;const now=Date.now();
  if(dd.start){const e=dd.end?T(dd.end):(day===dayKey(now)?now:T(dd.start));ms+=Math.max(0,e-T(dd.start));for(const b of dd.breaks||[]){const be=b.to?T(b.to):(day===dayKey(now)&&!dd.end?now:T(b.from));ms-=Math.max(0,be-T(b.from));}}
  for(const s of dd.sessions||[])ms+=Math.max(0,T(s.out||new Date().toISOString())-T(s.in));for(const m of dd.manual||[])ms+=(+m.h||0)*36e5;return Math.max(0,ms);}
function hoursOn(uid,day){return dayWorkMs(uid,day)/36e5;}
function breakMs(uid,day){const dd=S.time[uid]?.days?.[day];let ms=0;for(const b of dd?.breaks||[])ms+=Math.max(0,(b.to?T(b.to):Date.now())-T(b.from));return ms;}
function lastDays(n){const out=[];const now=Date.now();for(let i=n-1;i>=0;i--)out.push(dayKey(now-i*864e5));return out;}
function attState(uid){const dd=S.time[uid]?.days?.[dayKey(Date.now())];if(!dd||!dd.start)return 'off';if(dd.end)return 'ended';const b=(dd.breaks||[]).slice(-1)[0];return b&&!b.to?'break':'working';}
const ATT={off:['Not started','muted'],working:['Working','s-dn'],break:['On break','s-wc'],ended:['Day ended','']};
const hm=iso=>iso?fdt(iso).split(' ').pop():'—';
async function saveTime(mut){if(!S.db||!S.uid)return;const doc=clone(S.time[S.uid]||{days:{}});doc.days=doc.days||{};mut(doc);doc.updatedAt=new Date().toISOString();
  try{await enqueue('time',()=>S.db.doc('timelog/'+S.uid).set(doc));}catch(e){writeErr(e);}}
function timeCard(){const uid=S.uid;if(!uid)return '';const k=dayKey(Date.now());const dd=S.time[uid]?.days?.[k]||{};const st=attState(uid);const todayH=hoursOn(uid,k);const wk=lastDays(7);const wsum=wk.reduce((a,d)=>a+hoursOn(uid,d),0);const mx=Math.max(9,...wk.map(d=>hoursOn(uid,d)));
  const ps=myProjects();const hol=S.holidays[k];
  const line=[dd.start?`Started ${hm(dd.start)}`:'',...(dd.breaks||[]).map(b=>`Break ${hm(b.from)}–${b.to?hm(b.to):'now'}`),dd.end?`Ended ${hm(dd.end)}`:''].filter(Boolean).join(' · ');
  const btn=st==='off'?`<button class="btn primary big" data-act="att-start">Start my day</button>`:st==='working'?`<button class="btn" data-act="att-break">Lunch / break</button><button class="btn danger" data-act="att-end">End my day</button>`:st==='break'?`<button class="btn primary" data-act="att-back">Back from break</button><button class="btn danger" data-act="att-end">End my day</button>`:'<span class="muted">See you tomorrow.</span>';
  return `<div class="card timecard"><h3>Attendance today <span class="pill ${ATT[st][1]}">${ATT[st][0]}</span>${hol?`<span class="pill s-wc">Holiday: ${esc(hol)}</span>`:''}<span class="muted hsub">${fmtHrs(wsum)} this week</span></h3><div class="tcwrap">
    <div class="clock"><div class="big">${fmtHrs(todayH)}</div><div class="muted" style="font-size:12.5px">${line||'worked today, breaks excluded'}</div><div style="display:flex;gap:8px;flex-wrap:wrap">${btn}</div></div>
    <div class="wkbars">${wk.map(d=>{const v=hoursOn(uid,d);return `<div class="wkb" title="${fd(d)}: ${fmtHrs(v)}"><span style="height:${Math.round(v/mx*100)}%"></span><small>${'SMTWTFS'[new Date(d+'T00:00:00').getDay()]}</small></div>`;}).join('')}</div>
    <details class="manual"><summary>Forgot to clock? Add hours by hand</summary><div class="row2"><div class="field"><label for="mh-day">Day</label><input type="date" id="mh-day" value="${today()}"></div><div class="field"><label for="mh-h">Hours</label><input type="number" id="mh-h" min="0.25" step="0.25" placeholder="e.g. 2.5"></div></div><div class="row2"><div class="field"><label for="mh-pid">Project</label><select id="mh-pid"><option value="">General work</option>${ps.map(p=>`<option value="${esc(p.code)}">${esc(p.client)}</option>`).join('')}</select></div><div class="field"><label for="mh-note">What you worked on</label><input id="mh-note"></div></div><button class="btn" data-act="manual-hours">Add hours</button></details>
  </div></div>`;}
function attendanceTable(){const ms=members().filter(m=>m.uid);if(!ms.length)return '';const k=dayKey(Date.now());const wk=lastDays(7);
  return `<div class="card" style="margin-bottom:18px"><h3>Today's attendance <span class="muted hsub">${ms.filter(m=>attState(m.uid)==='working').length} working · ${ms.filter(m=>attState(m.uid)==='break').length} on break · ${ms.filter(m=>attState(m.uid)==='off').length} not started</span></h3><div style="overflow-x:auto"><table class="cpt"><thead><tr><th>Person</th><th>Status</th><th>Started</th><th>Breaks</th><th>Ended</th><th>11:30</th><th>7:30</th><th>Hours today</th><th>This week</th></tr></thead><tbody>${ms.map(m=>{const dd=S.time[m.uid]?.days?.[k]||{};const st=attState(m.uid);return `<tr class="click" data-act="profile" data-name="${esc(m.name)}"><td><span class="who"><span class="av sm" style="background:${personColor(m.name)}">${esc(initials(m.name))}</span><b>${esc(m.name)}</b></span></td><td><span class="pill ${ATT[st][1]}">${ATT[st][0]}</span></td><td class="mono">${hm(dd.start)}</td><td class="mono">${(dd.breaks||[]).length?fmtW(breakMs(m.uid,k)):'—'}</td><td class="mono">${hm(dd.end)}</td><td class="mono">${suMark(m.uid,k,'am')}</td><td class="mono">${suMark(m.uid,k,'pm')}</td><td class="mono">${fmtHrs(hoursOn(m.uid,k))}</td><td class="mono">${fmtHrs(wk.reduce((a,d)=>a+hoursOn(m.uid,d),0))}</td></tr>`;}).join('')}</tbody></table></div></div>`;}
const fmtHrs=h=>{const m=Math.round(h*60);return `${Math.floor(m/60)}h ${z(m%60)}m`;};

/* ============ performance + client charts ============ */
const PAL=['#2563eb','#ea580c','#16a34a','#a21caf','#0891b2','#ca8a04','#db2777','#4f46e5'];

function readTaskModal(){const d=S.modal.draft;const v=id=>$(id)?.value;d.title=(v('#tf-title')||'').trim();d.pid=$('#tf-project')?$('#tf-project').value:d.pid;d.assignee=v('#tf-assignee')||'';d.due=v('#tf-due')||'';d.priority=v('#tf-pri')||'Normal';d.stepId=v('#tf-step')||'';d.desc=(v('#tf-desc')||'').trim();d.hours=parseFloat(v('#tf-hours'))||null;d.kpis=(v('#tf-kpis')||'').split('\n').map(x=>x.trim()).filter(Boolean);d.subs=(v('#tf-subs')||'').split('\n').map(x=>x.trim()).filter(Boolean);d.needC3=!!$('#tf-c3')?.checked;}
async function setMyTask(t,s,note,link,kpis){
  if(!S.db||!S.uid)return;const now=new Date().toISOString();const cur=clone(S.done[S.uid]?.items?.[t.id]||{});const hist=[...(cur.hist||[]),{s,at:now,note:note||null,link:link||null}].slice(-40);
  const item={...cur,s,at:now,note:note||cur.note||null,link:link||cur.link||null,kpis:kpis||cur.kpis||null,hist};
  if(s==='doing')item.startedAt=now;
  if(s==='done'){item.rounds=[...(cur.rounds||[]),{start:cur.startedAt||now,end:now}];item.startedAt=null;}
  for(const k in item)if(item[k]===undefined)item[k]=null;
  try{await enqueue('done',async()=>{const ref=S.db.doc('taskdone/'+S.uid);if(S.done[S.uid])await ref.update({items:{[t.id]:item}});else await ref.set({items:{[t.id]:item}});});}catch(e){writeErr(e);}
}

/* ============ calendar date picker (no typing) ============ */
function datePick(id,val,opts){opts=opts||{};const lab=val?fdY(val)+' · '+dueIn(val).replace(/^Due /,''):(opts.ph||'Pick a date');
  return `<div class="dp" data-dp="${id}" data-min="${opts.min||''}"><input type="hidden" id="${id}" value="${esc(val||'')}"><button type="button" class="dpbtn ${val?'':'empty'}" data-act="dp-open" data-for="${id}" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>${esc(lab)}</span></button>
  <div class="dpchips">${[['Today',0],['Tomorrow',1],['In 3 days',3],['Next Monday','mon'],['In 1 week',7]].map(([l,v])=>`<button type="button" class="chip" data-act="dp-quick" data-for="${id}" data-v="${v}">${l}</button>`).join('')}${val?`<button type="button" class="chip" data-act="dp-clear" data-for="${id}">Clear</button>`:''}</div><div class="dppop" hidden></div></div>`;}
function dpMonth(box,ym){const val=box.querySelector('input').value;const min=box.dataset.min||'';const [Y,M]=ym.split('-').map(Number);const first=new Date(Date.UTC(Y,M-1,1));const lead=(first.getUTCDay()+6)%7;const n=new Date(Date.UTC(Y,M,0)).getUTCDate();const td=today();
  let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';for(let d=1;d<=n;d++){const ds=`${Y}-${z(M)}-${z(d)}`;const off=offDay(ds);const hol=S.holidays[ds];const past=min&&ds<min;
    cells+=`<button type="button" class="dpd ${ds===td?'today':''} ${ds===val?'sel':''} ${off?'wk':''} ${hol?'hol':''}" data-act="dp-pick" data-v="${ds}" ${past?'disabled':''} title="${hol?esc(hol):''}">${d}</button>`;}
  const prev=M===1?`${Y-1}-12`:`${Y}-${z(M-1)}`,next=M===12?`${Y+1}-01`:`${Y}-${z(M+1)}`;
  return `<div class="dph"><button type="button" class="btn small ghost" data-act="dp-nav" data-v="${prev}" aria-label="Previous month">‹</button><b>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'})}</b><button type="button" class="btn small ghost" data-act="dp-nav" data-v="${next}" aria-label="Next month">›</button></div><div class="dpw">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="dpg">${cells}</div><div class="dpf"><span><i class="lg hol"></i>Holiday</span><span><i class="lg wk"></i>Weekend</span></div>`;}
function dpSet(box,v){const inp=box.querySelector('input');inp.value=v||'';const b=box.querySelector('.dpbtn');b.classList.toggle('empty',!v);b.querySelector('span').textContent=v?fdY(v)+' · '+dueIn(v).replace(/^Due /,''):'Pick a date';box.querySelector('.dppop').hidden=true;inp.dispatchEvent(new Event('change',{bubbles:true}));}
document.addEventListener('mousedown',e=>{document.querySelectorAll('.dppop:not([hidden])').forEach(p=>{if(!p.parentNode.contains(e.target))p.hidden=true;});});

/* ============ KPI list editor (one row per KPI) ============ */
function kpiEd(id,list,attrs,dis,ph){const ls=(list||[]).filter(x=>String(x).trim());const rows=(ls.length?ls:['']).map((k,i)=>kpRow(id,k,i,dis,ph)).join('');
  return `<div class="kpied" data-for="${id}"><div class="kprows">${rows}</div>${dis?'':`<button type="button" class="btn small ghost kpadd" data-act="kpi-row-add" data-for="${id}">+ Add KPI</button>`}<textarea id="${id}" hidden ${attrs||''}>${esc(ls.join('\n'))}</textarea></div>`;}
function kpRow(id,k,i,dis,ph){return `<div class="kprow"><span class="kpn">${i+1}</span><input class="kpin" data-kfor="${id}" value="${esc(k)}" placeholder="${esc(ph||'e.g. 5 captions written')}" aria-label="KPI ${i+1}" ${dis||''}>${dis?'':`<button type="button" class="kpdel" data-act="kpi-row-del" aria-label="Remove KPI ${i+1}">✕</button>`}</div>`;}
function kpSync(box){const id=box.dataset.for;const ins=[...box.querySelectorAll('.kpin')];ins.forEach((x,i)=>{const n=x.parentNode.querySelector('.kpn');if(n)n.textContent=i+1;});const ta=box.querySelector('textarea');ta.value=ins.map(x=>x.value.trim()).filter(Boolean).join('\n');ta.dispatchEvent(new Event('input',{bubbles:true}));}
function kpAdd(box,focus){const rows=box.querySelector('.kprows');const n=rows.children.length;const t=document.createElement('div');t.innerHTML=kpRow(box.dataset.for,'',n,'',rows.querySelector('.kpin')?.placeholder);const r=t.firstElementChild;rows.appendChild(r);if(focus)r.querySelector('input').focus();}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.kfor){const box=e.target.closest('.kpied');if(box)kpSync(box);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.kfor){e.preventDefault();const box=e.target.closest('.kpied');const rows=[...box.querySelectorAll('.kprow')];const i=rows.indexOf(e.target.closest('.kprow'));if(i===rows.length-1)kpAdd(box,true);else rows[i+1].querySelector('input').focus();}});

/* ============ step KPI checklist ============ */
function prevTicks(s,st){if(s.mode!=='seq'||typeof st.level!=='number'||st.level===0)return null;const e=[...(st.log||[])].reverse().find(x=>(x.ev==='submit'||x.ev==='approve')&&x.lv===st.level-1);return e?{e,lv:s.chain[st.level-1]}:null;}
function stepKpiPanel(p,s,st,r,d,ro){const ks=kpiList(s);const edit=S.drawer.kpiEdit;const can=canManage(p)&&S.canWrite;

  ${pv&&!ro?`<div class="field"><label for="d-evid">Checked against which report / record (required to approve)</label><input id="d-evid" value="${esc(d.evidence||'')}" placeholder="e.g. GA4 report Oct, client email 14 Oct, Drive link"></div>`:''}
  ${pv?.e.evidence?`<div class="why" style="max-width:none">Earlier level checked against: ${esc(pv.e.evidence)}</div>`:''}
  <span class="muted" style="font-size:12px">Every level ticks the full list before passing it on.</span>`
  :lastE?ks.map((k,i)=>`<div class="krow2"><span class="${lastE.kt[i]?'okc':'late'}">${lastE.kt[i]?'☑':'☐'}</span><span>${esc(k)}</span></div>`).join('')+(lastE.evidence?`<div class="why" style="max-width:none">Verified against: ${esc(lastE.evidence)}</div>`:''):ks.map(k=>`<div class="krow2"><span class="muted">·</span><span>${esc(k)}</span></div>`).join('')}</div>`;}
function findStepPath(flow,sid){for(const ph of flow.phases)for(const g of ph.groups)for(const s of g.steps)if(s.id===sid)return s;return null;}

  const obj=t.dataset.ed==='ph'?x.ph:t.dataset.ed==='g'?x.g:t.dataset.ed==='s'?x.s:x.l;if(!obj)return;if(k==='h'||k==='days')val=parseFloat(val)||0;if(k==='kpisText'){obj.kpis=String(val).split('\n').map(x=>x.trim()).filter(Boolean);}else obj[k]=val;
  if(t.dataset.ed==='lv'&&k==='lv'){if(val==='C1'&&!obj.role)obj.role='SEO';if(val!=='C1')delete obj.role;}
  if(t.dataset.ed==='s'&&k==='mode'&&val==='meeting'){x.s.chain=[{lv:'C3',h:9}];}
  if(t.dataset.ed==='g'&&k==='par'&&!val){x.g.steps.forEach(s=>{if(s.mode==='meeting')s.mode='seq';});}
  const wasDirty=S.ed.dirty;S.ed.dirty=true;
  if(e.type==='change'&&(t.tagName==='SELECT'||t.type==='checkbox'))render();else if(!wasDirty){document.querySelectorAll('[data-act="ed-save"],[data-act="ed-reset"]').forEach(b=>b.disabled=false);}}
document.addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA'&&e.target.dataset.ed){edInput(e);return;}if(e.target.id==='sideq'){S.sideQ=e.target.value;setTabs();return;}if(e.target.dataset&&e.target.dataset.search!=null){S.search.q=e.target.value;runSearch(e.target.value);return;}if(e.target.id==='crmQ'){S.crmQ=e.target.value;const pos=e.target.selectionStart;render();const q=$('#crmQ');q.focus();q.setSelectionRange(pos,pos);return;}if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos);return;}if(e.target.tagName==='INPUT'&&e.target.dataset.ed)edInput(e);});
document.addEventListener('change',async e=>{
  if(e.target.id==='logoIn'){const f=e.target.files&&e.target.files[0];const pid=S.logoPid;if(!f||!pid)return;try{const url=await logoFile(f);if(url&&await saveProject(pid,{logo:url}))toast('Logo saved for '+(S.projects.get(pid)?.client||'client'));}catch(err){console.error(err);toast('Could not read that image.');}return;}
  if(e.target.id==='crmQ'){return;}if(e.target.id==='pickProject'){S.pid=e.target.value;ls.set('zw2.pid',S.pid);render();return;}
  if(e.target.id==='edApply'){S.ed.applyAll=e.target.checked;return;}
  if(e.target.id==='viewAs'){S.viewAs=e.target.value||null;S.drawer=null;S.modal=null;S.viewAuto=true;computeMe();render();window.scrollTo(0,0);return;}
  if(e.target.id==='rgEnd'){S.rg.end=e.target.value||today();render();return;}
  if(e.target.id==='rgN'){S.rg.n=Math.max(1,Math.min(365,parseInt(e.target.value,10)||7));render();return;}
  if(e.target.id==='dayPick'){S.dayPick=e.target.value||today();render();return;}
  if(['spWho','spPid','spKind'].includes(e.target.id)){S.spF=S.spF||{kind:'all',pid:'all',who:'all'};S.spF[{spWho:'who',spPid:'pid',spKind:'kind'}[e.target.id]]=e.target.value;render();return;}
  if(e.target.id==='fcPick'){S.fcPid=e.target.value;render();return;}
  if(e.target.dataset&&e.target.dataset.f==='level'){syncTeamDraft();return;}
  if(e.target.id==='repPick'){S.repPid=e.target.value;render();return;}
  if(e.target.id==='mapCollapse'){S.mapCollapse=e.target.checked;render();return;}
  if(e.target.id==='tf-pid'||e.target.id==='tf-who'){S.tf[e.target.id==='tf-pid'?'pid':'who']=e.target.value;render();return;}
  if(e.target.id==='tf-project'&&S.modal?.task){readTaskModal();renderLayer();return;}
  if(e.target.id==='edTarget'){if(S.ed?.dirty&&!S.ed.confirmSwitch){S.ed.confirmSwitch=true;toast('Unsaved changes: save or discard first, then switch.');e.target.value=S.ed.target;setTimeout(()=>{if(S.ed)S.ed.confirmSwitch=false;},2500);return;}edStart(e.target.value);render();return;}
  if(e.target.dataset.ed&&(e.target.tagName==='SELECT'||e.target.type==='checkbox'))edInput(e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.drawer||S.modal)){S.drawer=null;S.modal=null;renderLayer();}});
document.addEventListener('submit',async e=>{
  if(e.target.id==='propform'){e.preventDefault();const v=id=>($(id)?.value||'').trim();const title=v('#pf-title');if(!title){S.modal.err='Write what the task is.';renderLayer();return;}if(v('#pf-due')&&v('#pf-due')<today()){S.modal.err='The due date is in the past.';renderLayer();return;}
    const id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);const now=new Date().toISOString();
    const item={title,assignee:v('#pf-who')||myName(),pid:v('#pf-pid')||null,due:v('#pf-due')||null,hours:null,kpis:v('#pf-kpis').split('\n').map(x=>x.trim()).filter(Boolean),desc:v('#pf-desc'),createdAt:now};
    try{const ref=S.db.doc('proposals/'+S.uid);if(S.props?.[S.uid])await ref.update({items:{[id]:item}});else await ref.set({items:{[id]:item}});S.modal=null;renderLayer();toast('Sent to your Manager for approval');}catch(err){writeErr(err);}return;}
  if(e.target.id==='tform'){e.preventDefault();readTaskModal();const M=S.modal;const d=M.draft;const p=S.projects.get(d.pid);
    if(!d.title){M.err='Write what the task is.';renderLayer();return;}if(d.due&&d.due<today()&&(M.isNew||S.tasks.get(d.id)?.due!==d.due)){M.err='The due date is in the past. Pick today or a later day from the calendar.';renderLayer();return;}if(d.pid&&(!p||!canManage(p))){M.err='Pick a project you manage.';renderLayer();return;}if(!d.pid&&!(S.isLead||isMgr())){M.err='Pick a project.';renderLayer();return;}if(!d.assignee){M.err='Choose who does it.';renderLayer();return;}
    const mm=members().find(x=>x.name===d.assignee);const now=new Date().toISOString();const r=d.stepId&&p?metrics(p).rows.find(x=>x.s.id===d.stepId):null;
    const selfMgr=isMgr()&&d.assignee===myName();const data={skipC2:selfMgr||!!d.skipC2,pid:d.pid||null,title:d.title,desc:d.desc||'',assignee:d.assignee,assigneeUid:mm?.uid||null,due:d.due||null,priority:d.priority||'Normal',hours:d.hours||null,kpis:d.kpis||[],subs:d.subs||[],needC3:!!d.needC3||selfMgr,stepId:d.stepId||null,stepLabel:r?`${r.label} ${r.s.name}`:null,updatedAt:now};
    try{if(M.isNew){const id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);await S.db.doc('tasks/'+id).set({...data,id,createdAt:now,createdBy:S.uid||null,log:[{at:now,by:S.uid||null,txt:`Assigned to ${d.assignee}`}]});}
      else{const t=S.tasks.get(d.id);const ch=[];if(t.assignee!==d.assignee)ch.push(`Reassigned ${t.assignee} → ${d.assignee}`);if((t.due||'')!==(d.due||''))ch.push(`Due ${fd(t.due)} → ${fd(d.due)}`);if(t.title!==d.title)ch.push('Renamed');
        await S.db.doc('tasks/'+d.id).update({...data,log:[...(t.log||[]),{at:now,by:S.uid||null,txt:ch.join(' · ')||'Edited'}].slice(-40)});}
      S.modal=null;renderLayer();toast(M.isNew?(mm?.uid?'Task assigned':'Task assigned. Link this person\'s login so they can see it.'):'Task saved');}catch(err){writeErr(err);}
    return;}
  if(e.target.id!=='pform')return;e.preventDefault();readModal();const M=S.modal;const d=M.draft;
  if(!d.client){M.err='Enter the client name.';renderLayer();return;}
  if(!d.start){M.err='Pick a start date.';renderLayer();return;}
  if(M.isNew){if(!/^[A-Za-z0-9_.~:@+-]+$/.test(d.code||'')){M.err='Project ID can use letters, numbers and dashes only.';renderLayer();return;}if(S.projects.has(d.code)){M.err=d.code+' already exists.';renderLayer();return;}}
  const data={code:d.code,client:d.client,type:d.type,state:d.state,services:d.services,start:d.start,target:d.target||null,clientApprover:d.clientApprover||null,folder:d.folder||null};
  if(M.isNew||S.isLead)data.roles=d.roles;
  if(M.isNew){if(!(await saveProject(d.code,{...data,flow:clone(tpl()),flowLog:[],steps:{}},true)))return;}
  else{const p=S.projects.get(d.code);const changes=[];if(S.isLead){for(const k of Object.keys(ROLES)){const a=p.roles?.[k]||'',b=d.roles[k]||'';if(a!==b)changes.push(`${ROLES[k]}: ${a||'—'} → ${b||'—'}`);}}
    if(S.isLead){const ok=await saveProject(d.code,{...data,roles:null,...(changes.length?{flowLog:[...(p.flowLog||[]),{at:new Date().toISOString(),by:S.uid||null,changes:changes.map(c=>'Stakeholder '+c)}].slice(-50)}:{})});if(ok)await saveProject(d.code,{roles:d.roles});if(!ok)return;}
    else if(!(await saveProject(d.code,data)))return;}
  S.modal=null;S.pid=d.code;ls.set('zw2.pid',d.code);S.view='project';render();toast(M.isNew?'Project created':'Project saved');
});

async function makeSample(){
  if(!S.db)return;let code='ZW-DEMO',i=2;while(S.projects.has(code))code='ZW-DEMO'+(i++);
  const d=new Date();let k=8;while(k>0){d.setDate(d.getDate()-1);if(d.getDay()!==0&&d.getDay()!==6)k--;}const st0=ymd(d);
  const at=(bd,hr)=>{const x=pY(st0);let n=bd;while(n>0){x.setDate(x.getDate()+1);if(x.getDay()!==0&&x.getDay()!==6)n--;}return new Date(Date.UTC(x.getFullYear(),x.getMonth(),x.getDate(),hr-8,0)).toISOString();};
  const U=S.uid||null,Lk='https://docs.google.com/document/d/example';const steps={};
  const seq=(id,evs,level)=>{const log=evs.map(([ev,bd,hr,x])=>({ev,at:at(bd,hr),by:U,...(x||{})}));steps[id]={log,level,startedAt:log[0].at,doneAt:level==='done'?log[log.length-1].at:null,link:Lk};};
  seq('P0-01',[['start',0,9],['submit',0,10,{lv:0}]],'done');
  seq('P0-02',[['start',0,10],['submit',1,11,{lv:0,link:Lk}],['return',1,14,{lv:1,to:0,comment:'Example: add competitor rankings'}],['submit',2,10,{lv:0,link:Lk}],['approve',2,12,{lv:1}]],'done');
  seq('P0-03',[['start',0,10],['submit',0,17,{lv:0,link:Lk}],['approve',1,10,{lv:1}]],'done');
  seq('P0-04',[['start',0,11],['submit',2,15,{lv:0,link:Lk,comment:'Example: slow site, took longer'}],['approve',2,17,{lv:1}]],'done');
  steps['P0-06']={log:[{ev:'complete',at:at(3,15),by:U,comment:'Example: all three reviews approved in the joint meeting'}],done:true,doneAt:at(3,15),meetingDate:at(3,15).slice(0,10),notes:'Example: all three reviews approved'};
  seq('P0-07',[['start',3,16],['submit',4,15,{lv:0,link:Lk}],['approve',5,11,{lv:1}]],'done');
  seq('P0-08',[['start',5,11],['submit',5,12,{lv:0}]],'done');
  seq('P0-09',[['start',5,12],['submit',5,15,{lv:0,link:Lk}]],'done');
  seq('P0-10',[['start',5,15],['hold',5,16,{lv:0,s:'wc',comment:'Example: waiting for client feedback'}],['resume',7,10,{lv:0}],['submit',7,12,{lv:0,link:Lk}],['approve',7,15,{lv:1,comment:'Example: go ahead'}]],'done');
  seq('P1-01',[['start',7,16],['submit',8,10,{lv:0,link:Lk}]],1);
  const ok=await saveProject(code,{code,client:'Sample Client Pte Ltd (example)',type:'B2B',state:'Active',services:['SEO','SMM','WEB'],start:st0,target:null,clientApprover:'Example approver',folder:null,roles:defaultRoles(),flow:clone(tpl()),flowLog:[],steps},true);
  if(ok){S.pid=code;S.view='project';ls.set('zw3.view','project');render();toast('Sample project added. Delete it from Edit project.');}
}
let searchSeq=0;
async function runSearch(q){if(!S.user||!S.search)return;const my=++searchSeq;try{const hits=await S.user.search(q||'');if(my!==searchSeq||!S.search)return;S.search.hits=(hits||[]).slice(0,8);syncTeamDraft();const pos=$('#tm-s-'+S.search.i)?.selectionStart;render();const x=$('#tm-s-'+S.search.i);if(x){x.focus();if(pos!=null)x.setSelectionRange(pos,pos);}}catch(e){}}
let nameBusy=false;
async function resolveNames(){
  if(!S.user||nameBusy)return;const ids=new Set();const add=x=>{if(x&&!S.names[x])ids.add(x);};
  for(const p of S.projects.values()){for(const s of Object.values(p.steps||{})){for(const e of s.log||[])add(e.by);for(const c of Object.values(s.clicks||{}))add(c.by);}for(const x of p.flowLog||[])add(x.by);}for(const x of S.tplLog)add(x.by);for(const m of S.team)add(m.uid);for(const t of S.tasks.values()){add(t.createdBy);add(t.assigneeUid);for(const x of t.log||[])add(x.by);}
  if(!ids.size)return;nameBusy=true;try{const ps=await S.user.profiles([...ids]);let ch=false;for(const id of ids){const n=ps?.[id]?.name||'';if(n){S.names[id]=n;ch=true;}}if(ch){if(S.drawer)renderLayer();else if(S.view!=='process'&&S.view!=='team')render();}}catch(e){}finally{nameBusy=false;}
}
function safeRender(){MC=new WeakMap();computeMe();if(document.activeElement&&['mh-h','mh-note','mh-day','domIn','clk-pid','mh-pid','hol-name'].includes(document.activeElement.id))return;if(S.drawer||S.modal){if(S.drawer)readDrawer();if(S.modal)(S.modal.task?readTaskModal:readModal)();const D=S.drawer,M=S.modal;S.drawer=null;S.modal=null;if(S.view!=='process'&&S.view!=='team')render();S.drawer=D;S.modal=M;renderLayer();}else if(S.view==='process'&&S.ed?.dirty){/* keep the draft on screen */}else if(S.view==='team'&&(S.teamDraft||S.search)){}else render();}

/* ============ boot ============ */
computeMe();render();
(async()=>{
  const c=window.claude;
  if(!c||!c.use){S.offline=true;$('#conn').textContent='offline';render();return;}
  const [db,user]=await Promise.all([c.use('db'),c.use('user')]);S.user=user;
  if(!db){S.offline=true;$('#conn').textContent='offline';render();return;}
  S.db=db;
  try{S.uid=user?await user.id():null;}catch(e){}
  try{const cw=user?await user.can('data.write'):null;if(cw===false)S.canWrite=false;}catch(e){}
  try{S.isOwner=user?await user.isOwner():false;S.isLead=S.isOwner;S.canEditShare=user?await user.canEdit():false;}catch(e){}
  S.trueUid=S.uid;S.trueOwner=!!S.isOwner;S.trueCanEdit=S.canEditShare;
  {const real=db;const ro=()=>{const e=new Error('preview');e.code='preview';return Promise.reject(e);};S.db={collection:p=>real.collection(p),doc:p=>{const r=real.doc(p);return {onSnapshot:(...a)=>r.onSnapshot(...a),get:(...a)=>r.get(...a),set:(...a)=>S.viewAs?ro():r.set(...a),update:(...a)=>S.viewAs?ro():r.update(...a),delete:(...a)=>S.viewAs?ro():r.delete(...a)};}};}
  computeMe();
  $('#conn').textContent='live';setTimeout(()=>{S.bellReady=true;},3000);
  db.collection('wf_projects').onSnapshot(snap=>{S.projects=new Map(snap.docs.map(d=>{const v=d.data();return [d.id,{...v,code:v.code||d.id}];}));S.loaded=true;safeRender();resolveNames();},err=>{console.error(err);$('#conn').textContent='disconnected';});
  db.doc('config/template').onSnapshot(snap=>{const v=snap.exists?snap.data():null;S.template=v&&v.flow?v.flow:null;S.tplLog=v?.log||[];if(S.ed&&S.ed.target==='template'&&!S.ed.dirty)edStart('template');safeRender();resolveNames();},err=>console.error(err));
  db.doc('config/team').onSnapshot(snap=>{S.team=snap.exists?(snap.data().members||[]):[];S.teamLoaded=true;safeRender();resolveNames();},err=>console.error(err));
  db.doc('config/calendar').onSnapshot(snap=>{const v=snap.exists?snap.data():{};S.holidays=v.days||{};S.workdays=v.work||{};S.satWork=!!v.satWork;safeRender();},err=>console.error(err));
  if(S.uid)db.doc('data/users/'+S.uid+'/prefs').onSnapshot(snap=>{S.prefs=snap.exists?snap.data():{};setTabs();},err=>console.error(err));
  db.doc('config/settings').onSnapshot(snap=>{S.domain=(snap.exists&&snap.data().domain)||'zenwice.com';safeRender();},err=>console.error(err));
  db.collection('timelog').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});S.time=o;safeRender();},err=>console.error(err));
  db.collection('claims').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});S.claims=o;safeRender();},err=>console.error(err));
  db.collection('proposals').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});S.props=o;safeRender();},err=>console.error(err));
  db.collection('tasks').onSnapshot(snap=>{const all=snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]);S.rejected=Object.fromEntries(all.filter(x=>x[1].rejected));S.tasks=new Map(all.filter(x=>!x[1].rejected));safeRender();resolveNames();},err=>console.error(err));
  db.collection('taskdone').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});S.done=o;S.doneLoaded=true;safeRender();},err=>console.error(err));
  setInterval(()=>{if(['q','crmQ'].includes(document.activeElement?.id))return;safeRender();},60000);
})();
