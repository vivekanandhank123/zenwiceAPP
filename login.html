<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 2000 1201%22%3E%3Cpath fill=%22%235059ad%22 d=%22M0 0H1037L461 943H1165V1201H40L573 261H0Z%22/%3E%3Cpath fill=%22%235059ad%22 d=%22M582 914L1102 0L1723 736V15H1999V1201H1770L1139 439L860 914Z%22/%3E%3C/svg%3E">
<title>Zenwice Project Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky app bar + tabbed workspace; project view = header stats, phase pipeline, "now" lane, phase step lists; step editor in a side drawer. */
/* Layout: solid blue app bar, white cards on a pale blue ground; one light look, colours set explicitly. */
/* Layout: light grey sidebar (logo, search, icon nav, project list, user) + white main with a title bar, quick-action cards and a two-column dashboard. One light look. */
:root{
  --bg:#ffffff; --side:#f7f7f8; --surface:#ffffff; --sunk:#f5f5f7; --line:#e7e7eb; --fg:#18181b; --muted:#71717a;
  --accent:#2563eb; --accent-fg:#ffffff; --accent-soft:#eaf1ff;
  --ok:#16a34a; --ok-soft:#dcfce7; --prog:#2563eb; --prog-soft:#eaf1ff;
  --client:#c2410c; --client-soft:#ffedd5; --internal:#7e22ce; --internal-soft:#f3e8ff;
  --block:#dc2626; --block-soft:#fee2e2; --idle:#a1a1aa; --idle-soft:#f4f4f5;
  --shadow:0 16px 40px rgba(24,24,27,.14);
  --f-display:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:#fff;box-shadow:0 2px 10px rgba(29,78,216,.25)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:12px;color:#c7d6ff}
.tabs{display:flex;gap:2px;background:var(--bar-2);padding:3px;border-radius:10px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:600;color:#dbe6ff;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-current="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.small{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--block);border-color:var(--block)}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{padding-block:22px 80px}
.notice{background:var(--client-soft);color:var(--fg);border:1px solid var(--line);padding:10px 14px;border-radius:10px;margin-bottom:16px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;border-top:3px solid var(--accent)}
.kpi .n{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi.warn .n{color:var(--client)} .kpi.bad .n{color:var(--block)} .kpi.vio .n{color:var(--internal)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-weight:600;font-size:12.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.search{flex:1;min-width:180px;max-width:320px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}

/* table */
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:980px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--sunk)}
.pid{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cl{font-weight:700}
.bar-p{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;width:110px}
.bar-p i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--idle-soft);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ip{background:var(--prog-soft);color:var(--prog)} .s-dn{background:var(--ok-soft);color:var(--ok)}
.s-wc{background:var(--client-soft);color:var(--client)} .s-wi{background:var(--internal-soft);color:var(--internal)}
.s-bl{background:var(--block-soft);color:var(--block)} .s-na{background:none;color:var(--idle);border:1px dashed var(--line)}
.h-ok{background:var(--ok-soft);color:var(--ok)} .h-risk{background:var(--client-soft);color:var(--client)} .h-late{background:var(--block-soft);color:var(--block)}
.why{font-size:12.5px;color:var(--muted);margin-top:2px;max-width:260px}
.late{color:var(--block);font-weight:600}

/* empty */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center}
.empty h2{font-size:20px;margin-bottom:6px}
.empty p{color:var(--muted);max-width:52ch;margin:0 auto 16px}

/* project view */
.crumb{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.phead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.phead h1{font-size:28px;font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
@media (max-width:900px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.pipe{display:flex;align-items:stretch;gap:0;margin-bottom:18px;overflow-x:auto}
.ph{flex:1 1 0;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ph.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ph .k{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ph .nm{font-weight:700;margin:1px 0 6px}
.ph .bar-p{width:100%}
.ph .d{font-size:11.5px;color:var(--muted);margin-top:6px}
.gate{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px;gap:3px}
.gate i{width:12px;height:12px;transform:rotate(45deg);border:2px solid var(--line);background:var(--surface)}
.gate.done i{background:var(--ok);border-color:var(--ok)}
.gate span{font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}

.grid2 .tcwrap{grid-template-columns:1fr}.grid2 .wkbars{height:80px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(15,31,61,.04)}
.card>h3{font-size:14.5px;color:var(--fg);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.now{border-color:var(--accent)}
.now-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.now-item:last-child{border-bottom:0}
.now-item .t{font-weight:600}
.now-item .m{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.now-item .acts{display:flex;gap:6px;align-items:start;flex-wrap:wrap;justify-content:flex-end}

.phase-sec{margin-top:16px}
.phase-sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px}
.phase-sec>summary::-webkit-details-marker{display:none}
.phase-sec>summary h3{font-size:15px}
.phase-sec>summary .sp{margin-left:auto;display:flex;gap:10px;align-items:center}
.step{display:grid;grid-template-columns:62px minmax(0,1fr) 150px 92px 64px 132px;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.step:hover{background:var(--sunk)}
.step.na{opacity:.5}
.step.frontier{box-shadow:inset 3px 0 0 var(--accent)}
.step .id{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.step .ws{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.step .gt{font-size:10.5px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:6px}
.step .own{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .due{font-size:12.5px;font-variant-numeric:tabular-nums}
.step .tt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:760px){.step{grid-template-columns:52px minmax(0,1fr) auto}.step .own,.step .due,.step .tt{display:none}}

.feed{max-height:420px;overflow:auto}
.ev{padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.ev:last-child{border-bottom:0}
.ev b{font-weight:600}
.roles{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;padding:12px 14px;font-size:13px}
.roles span:nth-child(odd){color:var(--muted)}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.person h3{font-size:15px}
.person .sub{font-size:12px;color:var(--muted);font-weight:500;font-family:var(--f-body)}
.ptask{padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.ptask:hover{background:var(--sunk)}
.ptask .t{font-size:13px;font-weight:600}
.ptask .m{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}

/* workflow reference */
.wf-phase{margin-bottom:22px}
.wf-phase h2{font-size:18px;margin-bottom:8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.wf-phase h2 small{font-family:var(--f-body);font-size:12.5px;color:var(--muted);font-weight:500}
.lane{font-size:11px;font-family:var(--f-mono);color:var(--internal)}
.new{font-size:10.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:4px;margin-left:6px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(5,15,15,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dh h2{font-size:17px;line-height:1.3}
.db{padding:16px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.flabel{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{min-height:68px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].s-ns{background:var(--idle-soft);color:var(--fg);border-color:var(--idle)}
.seg button[aria-pressed="true"].s-ip{border-color:var(--prog)} .seg button[aria-pressed="true"].s-dn{border-color:var(--ok)}
.seg button[aria-pressed="true"].s-wc{border-color:var(--client)} .seg button[aria-pressed="true"].s-wi{border-color:var(--internal)}
.seg button[aria-pressed="true"].s-bl{border-color:var(--block)} .seg button[aria-pressed="true"].s-na{border-style:solid;border-color:var(--idle)}
.seg button.s-ip,.seg button.s-dn,.seg button.s-wc,.seg button.s-wi,.seg button.s-bl{background:var(--surface)}
.seg button[aria-pressed="true"].s-ip{background:var(--prog-soft);color:var(--prog)}
.seg button[aria-pressed="true"].s-dn{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"].s-wc{background:var(--client-soft);color:var(--client)}
.seg button[aria-pressed="true"].s-wi{background:var(--internal-soft);color:var(--internal)}
.seg button[aria-pressed="true"].s-bl{background:var(--block-soft);color:var(--block)}
.ref{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:12.5px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px}
.ref span:nth-child(odd){color:var(--muted)}
.err{color:var(--block);font-size:12.5px;font-weight:600}
.hist{border-left:2px solid var(--line);margin-left:4px;padding-left:12px;display:flex;flex-direction:column;gap:8px}
.hist div{font-size:12.5px}
.modal{position:fixed;inset:0;z-index:41;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(680px,100%);display:flex;flex-direction:column}
.svc{display:flex;flex-wrap:wrap;gap:8px}
.svc label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;text-transform:none;letter-spacing:0;color:var(--fg)}
.rolegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.rolegrid{grid-template-columns:1fr}}
.cpm{display:inline-flex;gap:3px;align-items:center;font-family:var(--f-mono);font-size:11px;margin-top:3px}
.cpm i{font-style:normal;padding:0 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.cpm i.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.cpm i.cur{border-color:var(--accent);color:var(--accent);font-weight:600}.cpm i.over{background:var(--block-soft);color:var(--block);border-color:var(--block)}
.cpm b{color:var(--idle);font-weight:400}
.cppipe{display:flex;align-items:stretch;gap:4px}
.cpbox{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:var(--surface)}
.cpbox.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.cpbox.ok{background:var(--ok-soft)}.cpbox.over .cpt2{color:var(--block);font-weight:700}
.cpc{font-family:var(--f-mono);font-weight:600;font-size:13px}.cpr{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.cpn{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cpt2{font-size:12px;font-variant-numeric:tabular-nums;margin-top:2px}
.cparrow{align-self:center;color:var(--idle)}
.cppanel{background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.cplink{color:var(--accent);font-weight:600;font-size:12.5px}
.cpv{font-size:12.5px}.okc{color:var(--ok)}
table.cpt{min-width:640px}table.cpt td{font-size:12.5px}
.slain{width:64px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
.teamrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,2fr) auto;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.teamrow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;width:100%}
.rchips{display:flex;flex-wrap:wrap;gap:5px}
.rchips button{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11.5px;padding:2px 7px;color:var(--muted);font-weight:600}
.rchips button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (max-width:760px){.teamrow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slin .18s ease-out}@keyframes slin{from{transform:translateX(24px);opacity:.6}}}

.bar .btn.primary{background:#fff;color:var(--accent);border-color:#fff}
.bar .btn.primary:hover{background:#eef3ff}
.user{display:flex;gap:8px;align-items:center;color:#fff;font-size:12.5px;line-height:1.2}
.user b{display:block;font-weight:700}.user small{color:#c7d6ff}
.av{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;font-weight:700}
.kpi.good .n{color:var(--ok)} .kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:480px){.kpis.k3,.stats.s3{grid-template-columns:1fr}}
.hello{margin-bottom:18px}.hello h1{font-size:26px;font-weight:700;color:var(--fg)}.hello p{margin:4px 0 0}
.mytask{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}

/* ===== shell ===== */
body{font-size:14px}

.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}

.mark{width:32px;height:32px;border-radius:9px;border:1.5px solid #c7d2fe;background:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--fg)}

.sidesearch{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;color:var(--muted)}

.snav{display:flex;flex-direction:column;gap:2px;background:none;padding:0;border-radius:0;overflow:visible}

.ic{width:18px;height:18px;flex-shrink:0}
.sect{font-size:12px;color:var(--muted);padding:14px 10px 4px;font-weight:500}
.sproj{display:flex;flex-direction:column;gap:1px}

.side .user{margin-top:auto;display:flex;gap:9px;align-items:center;padding:10px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--fg);font-size:12.5px;line-height:1.25}

.mainw{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

.pi{width:18px;height:18px}
main.wrap{max-width:1320px;margin:0;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:22px 80px}
.btn{border-radius:9px;border-color:var(--line);font-weight:500}

.card{border-radius:16px;box-shadow:none;border-color:var(--line)}

.kpi{border-radius:14px;border-top:1px solid var(--line)}

.bar-p i{background:var(--accent)}
.notice{background:#eff6ff;border-color:#dbeafe}

/* quick actions */

@media (max-width:1100px){.qa{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .shell{grid-template-columns:1fr}

}

.calhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.calhead h2{font-size:20px;font-weight:700;min-width:170px;text-align:center}
.calgrid{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.caldays,.calcells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.caldays span{padding:8px 10px;font-size:12px;color:var(--muted);font-weight:500;background:var(--sunk);border-bottom:1px solid var(--line)}
.cc{min-height:104px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cc:nth-child(7n){border-right:0}
.cc.we{background:#fafafa}.cc.hol{background:#fef2f2}.cc.tod .cd{background:var(--accent);color:#fff}
.cc.sel{box-shadow:inset 0 0 0 2px var(--accent)}.cc.click:hover{background:#f5f9ff}
.cd{font-size:12.5px;font-weight:600;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.chol{font-size:11.5px;color:var(--block);font-weight:600}
.ctask{font-size:11.5px;background:#eff6ff;color:#1e40af;border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ctask.done{background:var(--ok-soft);color:var(--ok);text-decoration:line-through}
.chrs{margin-top:auto;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
@media (max-width:700px){.cc{min-height:64px;padding:4px}.ctask,.chol{display:none}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard2{display:flex;flex-direction:column;gap:14px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.pcard2:hover{border-color:#bfdbfe}
.ph2{display:flex;gap:14px;align-items:center}.ph2 b{display:block;font-size:15.5px}.ph2 small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.ph2 .bav{margin:0;width:52px;height:52px;font-size:17px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pstats span{background:var(--sunk);border-radius:10px;padding:8px 10px}.pstats b{display:block;font-size:15px;font-variant-numeric:tabular-nums}.pstats small{color:var(--muted);font-size:11.5px}
.profhead{display:flex;gap:16px;align-items:center;margin-bottom:18px}.profhead h1{font-size:24px;font-weight:700}.profhead .bav{margin:0}
.stats.s5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1000px){.stats.s5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.stats.s5{grid-template-columns:repeat(2,minmax(0,1fr))}}

.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.kh{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:2px 4px}
.kcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.kcard:hover{border-color:var(--accent)} .kcard:focus-visible{outline:2px solid var(--accent)}
.kcard small{color:var(--muted);font-size:11.5px} .kcard.klate{border-left:3px solid #dc2626}
.kempty{color:var(--muted);font-size:12px;text-align:center;padding:16px 0}
.sucard .surow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.su{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.su b{min-width:70px}
.wchip{display:inline-block;margin:2px 6px 2px 0;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;cursor:pointer}
tr.sub td{border-top:none;padding-top:0}
.lvsel{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-right:6px}
.lvsel select{font:inherit;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:var(--surface)}
.reqcard{border-color:#fcd34d}
@media(max-width:700px){.sucard .surow{grid-template-columns:1fr}}

.segwrap{display:flex;align-items:center;gap:10px;margin:-4px 0 18px;flex-wrap:wrap}
.seglbl{font-size:12.5px}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--side)}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button .ic{width:16px;height:16px}
.seg button[aria-selected=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(16,24,40,.08);border:1px solid var(--line);padding:6px 13px}
.seg button:focus-visible{outline:2px solid var(--accent)}
.ktype{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;align-self:flex-start}
.ktype.step{background:#eef2ff;color:#4f46e5}.ktype.task{background:var(--accent-soft);color:var(--accent)}
.kid{color:var(--muted);font-weight:500;font-size:12px;margin-right:2px}
.kh small{font-size:11.5px}
.kn{font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.kc-c2 .kh b{color:#c2410c}.kc-c3 .kh b{color:#15803d}.kc-doing .kh b{color:var(--accent)}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
@media(max-width:800px){.kpis.k4{grid-template-columns:1fr 1fr}}

.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1100px){.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.kpis.k6{grid-template-columns:repeat(2,minmax(0,1fr))}}
button.kpi{all:unset;box-sizing:border-box;cursor:pointer}
.kpis .kpi.click{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:border-color .15s}
.kpis .kpi.click:hover,.kpis .kpi.click:focus-visible{border-color:var(--accent);outline:none}
.kpi .n small{font-size:15px;color:var(--muted);font-weight:500;margin-left:2px}
.lp{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:10px;background:var(--surface)}
.lph{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.lpt{display:flex;flex-direction:column;gap:2px;min-width:0}.lpt b{font-size:15px}.lpt span{font-size:12.5px}
.lpstats{display:flex;gap:18px;flex-wrap:wrap}
.lpstats span,.tstats span{display:flex;flex-direction:column;gap:1px}
.lpstats small,.tstats small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lpstats b{font-size:14px;font-variant-numeric:tabular-nums}
.phbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.phseg{position:relative;height:18px;border-radius:5px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.phseg i{position:absolute;inset:0 auto 0 0;background:#bfd3ff}
.phseg.cur{border-color:var(--accent)}.phseg.cur i{background:var(--accent);opacity:.35}
.phseg.done i{background:#86efac;width:100%!important}
.phseg small{position:relative;font-size:10.5px;font-weight:600;padding-left:6px;line-height:16px;color:var(--fg)}
.why-list{display:flex;flex-direction:column;gap:4px}
.wl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px;padding:6px 8px;border-radius:8px;background:var(--sunk)}
.wl.click:hover{background:var(--accent-soft)}
.wtag{font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.wtag.over{background:#fee2e2;border-color:#fecaca;color:#b91c1c}.wtag.task{background:var(--accent-soft);border-color:#c7d7fe;color:var(--accent)}
.wtag.wc{background:#fef3c7;border-color:#fde68a;color:#92400e}.wtag.bl{background:#fee2e2;border-color:#fecaca;color:#b91c1c}.wtag.step{background:#eef2ff;border-color:#c7d2fe;color:#4f46e5}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface);min-width:0}
.tcard:hover{border-color:var(--accent)}
.tch{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.tch .bav{width:38px;height:38px;font-size:14px}
.tch b{display:block;font-size:14.5px}.tch small{color:var(--muted);font-size:12px}
.tnow{font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;border-top:1px solid var(--line);padding-top:10px}
.tstats b{font-size:14px;font-variant-numeric:tabular-nums}.tstats em{font-style:normal;font-size:11px;color:var(--muted)}
.tlist{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.tlist span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpied{display:flex;flex-direction:column;gap:6px}
.kprows{display:flex;flex-direction:column;gap:6px}
.kprow{display:grid;grid-template-columns:22px 1fr 30px;gap:6px;align-items:center}
.kpn{font-size:11.5px;color:var(--muted);text-align:center;background:var(--sunk);border-radius:6px;padding:3px 0}
.kprow .kpin{width:100%}
.kpdel{all:unset;cursor:pointer;text-align:center;color:var(--muted);border-radius:6px;padding:4px 0}.kpdel:hover{background:#fee2e2;color:#b91c1c}
.kpadd{align-self:flex-start}
.seg.sm button{padding:5px 11px;font-size:12.5px}.seg.sm button[aria-selected=true]{padding:4px 10px}
.rgbar{align-items:center}.rglab{font-size:12.5px;margin-left:auto}

.empty.claim{max-width:820px}
.claimgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:14px;text-align:left}
.claimgrid .tcard{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--surface)}
.claimgrid .tcard:hover,.claimgrid .tcard:focus-visible{border-color:var(--accent)}
.claimgrid .bav{width:36px;height:36px}

/* late projects */
.lplist{display:flex;flex-direction:column;gap:14px}
.lp2{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;position:relative}
.lp2::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:#f59e0b}
.lp2.sev-red::before{background:#dc2626}
.lp2h{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:14px 16px 12px 20px;border-bottom:1px solid var(--line)}
.lp2h .pt{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px}
.lp2t{display:flex;flex-direction:column;gap:2px;min-width:0}.lp2t>b{font-size:16px}.lp2t span{font-size:12.5px;color:var(--muted)}.lp2t span b{color:var(--fg);font-weight:600}
.lp2s{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sevchip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.sev-amber .sevchip{background:#fffbeb;color:#92400e;border-color:#fde68a}
.lp2b{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px 22px;padding:14px 16px 6px 20px}
.lp2steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.lpst{display:flex;flex-direction:column;gap:3px;padding-right:8px;position:relative}
.lpst::after{content:"";position:absolute;top:13px;left:30px;right:0;height:2px;background:var(--line)}
.lpst:last-child::after{display:none}
.lpst.done::after{background:#86efac}
.lpst .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--sunk);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1}
.lpst.done .dot{background:#dcfce7;border-color:#86efac;color:#15803d}
.lpst.cur .dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.lpst b{font-size:12.5px;font-weight:600;margin-top:4px}.lpst small{font-size:11.5px;color:var(--muted)}
.lpst.cur b{color:var(--accent)}
.lp2k{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lp2k span{display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-radius:10px;padding:8px 10px}
.lp2k small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.lp2k b{font-size:14px;font-variant-numeric:tabular-nums}.lp2k em{font-style:normal;font-size:12px}
.lptrack{grid-column:1/-1;position:relative;height:58px;margin:4px 40px 0 6px}
.lpline{position:absolute;top:10px;left:0;right:0;height:6px;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.lpline .fill{position:absolute;inset:0 auto 0 0;background:#bfd3ff;border-radius:6px}
.lpline .gap{position:absolute;top:-1px;bottom:-1px;background:repeating-linear-gradient(45deg,#fecaca 0 6px,#fee2e2 6px 12px);border-radius:4px}
.mk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap;padding-top:22px}
.mk::before{content:"";position:absolute;top:6px;width:2px;height:14px;background:var(--muted);border-radius:2px}
.mk b{font-size:11px;color:var(--fg);font-weight:600}
.mk.start{transform:none;align-items:flex-start}.mk.start::before{left:0}
.mk.now::before{background:var(--accent);width:3px}.mk.now b{color:var(--accent)}
.mk.dl::before{background:#0f172a}.mk.fc::before{background:#16a34a}.mk.fc.bad::before{background:#dc2626}.mk.fc.bad b{color:#b91c1c}
.lp2i{padding:6px 16px 14px 20px;display:flex;flex-direction:column;gap:4px}
.lpih{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 2px}
.lpi{display:grid;grid-template-columns:96px minmax(0,1fr) 190px 170px;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--sunk);font-size:13px;cursor:pointer}
.lpi:hover{background:var(--accent-soft)}
.lpi .wtag{justify-self:start}
.lpit{min-width:0;overflow:hidden;text-overflow:ellipsis}
.lpir{display:flex;flex-direction:column;align-items:flex-end;gap:1px}.lpir small{font-size:11px;color:var(--muted)}
@media(max-width:1000px){.lp2b{grid-template-columns:1fr}.lpi{grid-template-columns:auto minmax(0,1fr);}.lpi .who,.lpi .lpir{grid-column:2}.lpir{align-items:flex-start}.lp2h{grid-template-columns:auto minmax(0,1fr)}.lp2s,.lp2h .btn{grid-column:1/-1;justify-content:flex-start}}
/* priority */
.prio{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid}
.prio::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.prio.pr-h{color:#b91c1c;background:#fef2f2;border-color:#fecaca}
.prio.pr-n{color:#15803d;background:#f0fdf4;border-color:#bbf7d0}
.prio.pr-l{color:#6d28d9;background:#f5f3ff;border-color:#ddd6fe}
.kcard.kp-pr-h{border-left:3px solid #dc2626}.kcard.kp-pr-n{border-left:3px solid #16a34a}.kcard.kp-pr-l{border-left:3px solid #8b5cf6}
.ktop{display:flex;justify-content:space-between;align-items:center;gap:6px}
/* date picker */
.dp{position:relative;display:flex;flex-direction:column;gap:6px}
.dpbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--surface);font-size:13.5px}
.dpbtn svg{width:17px;height:17px;color:var(--accent)}.dpbtn.empty span{color:var(--muted)}
.dpbtn:hover,.dpbtn:focus-visible{border-color:var(--accent)}
.dpchips{display:flex;gap:5px;flex-wrap:wrap}.dpchips .chip{font-size:11.5px;padding:3px 9px}
.dppop{position:absolute;top:42px;left:0;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.16);padding:10px;width:280px}
.dph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.dph b{font-size:13.5px}
.dpw,.dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dpw span{font-size:11px;color:var(--muted);padding:3px 0}
.dpd{all:unset;cursor:pointer;font-size:12.5px;padding:7px 0;border-radius:7px;text-align:center;font-variant-numeric:tabular-nums}
.dpd:hover{background:var(--accent-soft)}.dpd.wk{color:var(--muted)}.dpd.hol{color:#b45309;background:#fffbeb}
.dpd.today{box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:600}.dpd.sel{background:var(--accent);color:#fff}
.dpd[disabled]{opacity:.3;cursor:not-allowed;background:none}
.dpf{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:6px}.dpf .lg{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}.lg.hol{background:#fde68a}.lg.wk{background:var(--sunk);border:1px solid var(--line)}
/* KPI rows */
.kpied{background:#f5f8ff;border:1px solid #dbe5ff;border-radius:10px;padding:8px}
.kprow .kpin{border:1px solid #d3ddf2;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;background:#fff;color:var(--fg);outline:none}
.kprow .kpin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.kprow .kpin::placeholder{color:#94a3b8}
.kpn{background:#e3ebff;color:var(--accent);font-weight:600}
.kpadd{color:var(--accent)}
.edkpi .kpied{margin-top:2px}

/* logos */
.lgav{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:9px;overflow:hidden;background:#fff;border:1px solid var(--line);color:#fff;font-weight:600;font-size:12px}
.lgav img{width:100%;height:100%;object-fit:contain;padding:3px;box-sizing:border-box}
.lgav.ini{border:none}
.lgav.xs{width:22px;height:22px;border-radius:6px;font-size:9.5px}.lgav.xs img{padding:1px}
.lgav.sm{width:30px;height:30px;font-size:11px}
.lgav.md{width:42px;height:42px;border-radius:11px;font-size:14px}
.lgav.lg{width:60px;height:60px;border-radius:14px;font-size:20px}
.phl{display:flex;gap:14px;align-items:flex-start}
.lgbtns{display:inline-flex;gap:4px;margin:2px 0 4px -8px}
.cname{display:flex;gap:10px;align-items:center}
.sp .lgav{margin-right:2px}
/* timeline rows */
.lptrack{height:auto!important;min-height:58px;padding-bottom:6px}
.mk.r1{padding-top:50px}.mk.r1::before{height:42px}
.mk.r2{padding-top:78px}.mk.r2::before{height:70px}
.lptrack:has(.mk.r1){min-height:86px}.lptrack:has(.mk.r2){min-height:114px}
.mk.al-l{transform:none;align-items:flex-start}.mk.al-l::before{left:0}
.mk.al-r{transform:translateX(-100%);align-items:flex-end}.mk.al-r::before{right:0}
.mk.start{transform:none}
/* clients */
.funnel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:14px}
.fstage{all:unset;box-sizing:border-box;cursor:pointer;position:relative;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.fstage b{font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}.fstage small{font-size:12px;color:var(--muted)}
.fstage .fk{font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.fstage.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fstage:hover{border-color:var(--accent)}

<script>


/* ============ ROLES + DEFAULT PROCESS (from the Zenwice Project Workflow Process doc) ============ */
const ROLES={LEAD:'Lead',MGR:'Manager',BA:'Business Analyst',SEO:'SEO',SMM:'SMM',WEB:'Website',PAID:'Paid media',GFX:'Graphic',VID:'Video Editor',OTH:'Others'};
const C1_ROLES=['SEO','SMM','WEB','PAID','GFX','VID','OTH','BA','MGR'];
const LV={C1:'Representative',C2:'Manager',C3:'Lead',BA:'Business Analyst'};
const SERVICES={SEO:'SEO',SMM:'Social media',WEB:'Website',PAID:'Paid media',OTHER:'Other channels'};
const MODES={seq:'In order (→)',all:'Everyone clicks (+)',meeting:'Joint C3 meeting'};
const PHASE_NAMES=[['P0','Pre-Onboarding'],['P1','Client Onboarding'],['P2','Strategy'],['P3','Execution']];
const L=(lv,h,role)=>role?{lv,h,role}:{lv,h};
const S_=(id,name,scope,mode,chain,gate)=>({id,name,scope,mode,chain,gate:gate||''});
const G_=(id,name,par,steps)=>({id,name,par,steps});
const DEFAULT_FLOW={phases:[
 {k:'P0',name:'Pre-Onboarding',days:5,groups:[
  G_('g01','Lead initiate',false,[S_('P0-01','Register the lead and create the Project ID','req','seq',[L('C2',2)])]),
  G_('g02','Preliminary review',true,[
   S_('P0-02','SEO review','SEO','seq',[L('C1',9,'SEO'),L('C2',4)]),
   S_('P0-03','SMM review','SMM','seq',[L('C1',9,'SMM'),L('C2',4)]),
   S_('P0-04','Website review','WEB','seq',[L('C1',9,'WEB'),L('C2',4)]),
   S_('P0-05','Others review (paid, branding, listings)','OTHER','seq',[L('C1',9,'OTH'),L('C2',4)]),
   S_('P0-06','Joint review meeting: all C1 + C2 present','req','meeting',[L('C3',9)])]),
  G_('g03','Draft finalisation',false,[
   S_('P0-07','Combine into final draft','req','seq',[L('C2',9),L('C3',4)]),
   S_('P0-08','Send final draft to Lead','req','seq',[L('C3',2)]),
   S_('P0-09','Lead shares draft with client','req','seq',[L('C3',4)]),
   S_('P0-10','Capture feedback, follow up, go / no-go','req','seq',[L('C2',9),L('C3',4)],'Go / No-go')])]},
 {k:'P1',name:'Client Onboarding',days:8,groups:[
  G_('g11','Google Form',false,[
   S_('P1-01','Send Google Form to client','req','seq',[L('BA',2),L('C2',2)]),
   S_('P1-02','Receive completed form','req','seq',[L('BA',9),L('C2',2)]),
   S_('P1-03','Review answers and list missing items','req','seq',[L('C2',4)])]),
  G_('g12','Kickoff',false,[
   S_('P1-04','Schedule intro call','req','seq',[L('BA',4),L('C2',1)]),
   S_('P1-05','Intro call + agenda + shoot planning','req','all',[L('BA',4),L('C2',4)]),
   S_('P1-06','Complete the form with call answers','req','seq',[L('C2',4)])]),
  G_('g13','Asset collection',true,[
   S_('P1-07','Asset Excel sheet (logos, brand files, links)','req','seq',[L('BA',9),L('C2',2)]),
   S_('P1-08','Verify access + photos of the office','req','seq',[L('C2',9)])]),
  G_('g14','NDA',false,[S_('P1-09','NDA email to client','req','seq',[L('BA',2),L('C2',1)],'G0')])]},
 {k:'P2',name:'Strategy',days:10,groups:[
  G_('g21','Marketing audit',true,[
   S_('P2-01','SEO audit','SEO','seq',[L('C1',18,'SEO'),L('C2',4),L('C3',4)]),
   S_('P2-02','SMM audit','SMM','seq',[L('C1',9,'SMM'),L('C2',4),L('C3',4)]),
   S_('P2-03','Website audit','WEB','seq',[L('C1',9,'WEB'),L('C2',4),L('C3',4)]),
   S_('P2-04','Paid audit','PAID','seq',[L('C1',9,'PAID'),L('C2',4),L('C3',4)]),
   S_('P2-05','Others audit','OTHER','seq',[L('C1',9,'OTH'),L('C2',4),L('C3',4)])]),
  G_('g22','Strategy',true,[
   S_('P2-06','SEO strategy','SEO','seq',[L('C1',9,'SEO'),L('C2',4)]),
   S_('P2-07','SMM strategy','SMM','seq',[L('C1',9,'SMM'),L('C2',4)]),
   S_('P2-08','Website strategy','WEB','seq',[L('C1',9,'WEB'),L('C2',4)]),
   S_('P2-09','Paid media strategy','PAID','seq',[L('C1',9,'PAID'),L('C2',4)]),
   S_('P2-10','Scripts','SMM','seq',[L('C1',9,'VID'),L('C2',4)]),
   S_('P2-11','Others strategy','OTHER','seq',[L('C1',9,'OTH'),L('C2',4)]),
   S_('P2-12','Delivery calendar','req','seq',[L('C2',4)]),
   S_('P2-13','Joint strategy review: all C1 + C2 present','req','meeting',[L('C3',9)],'G1')])]},
 {k:'P3',name:'Execution',days:20,groups:[
  G_('g31','Plan + routing',false,[
   S_('P3-01','Combine data + calendar','req','seq',[L('C2',9),L('C3',4)]),
   S_('P3-02','Presentation to client','req','all',[L('BA',18),L('C2',18),L('C3',18)]),
   S_('P3-03','Feedback and review','req','all',[L('C1',9,'SEO'),L('C2',4)]),
   S_('P3-04','Share final plan with client','req','seq',[L('C2',4),L('C3',2)])]),
  G_('g32','Delivery',true,[
   S_('P3-05','SEO weeks 1–2 delivery','SEO','seq',[L('C1',45,'SEO'),L('C2',4),L('C3',4)]),
   S_('P3-06','Social content batch','SMM','seq',[L('C1',27,'SMM'),L('C2',4),L('C3',4)]),
   S_('P3-07','Graphics + video edits','SMM','seq',[L('C1',27,'GFX'),L('C2',4)]),
   S_('P3-08','Website release','WEB','seq',[L('C1',45,'WEB'),L('C2',4),L('C3',4)]),
   S_('P3-09','Tracking verified (GA4, GTM, pixels)','req','seq',[L('C1',9,'OTH'),L('C2',4)])]),
  G_('g33','Paid launch',false,[
   S_('P3-10','Record organic start date','PAID','seq',[L('C2',2)]),
   S_('P3-11','14-day organic wait','PAID','seq',[L('C2',90)]),
   S_('P3-12','Go / no-go checklist','PAID','seq',[L('C2',4),L('C3',4)],'G5'),
   S_('P3-13','Launch ads','PAID','seq',[L('C1',9,'PAID'),L('C2',4)])]),
  G_('g34','Monthly review',false,[
   S_('P3-14','Monthly report','req','seq',[L('C2',9),L('C3',4)]),
   S_('P3-15','Share report with client','req','seq',[L('BA',4),L('C2',1)],'G6')])]}]};

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const z=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const pY=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
const today=()=>ymd(new Date());
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fd(s){if(!s)return '—';const d=typeof s==='number'?new Date(s):pY(String(s).slice(0,10));return d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+String(d.getFullYear()).slice(2):'');}
function fdt(iso){const d=new Date(iso);return fd(ymd(d))+' '+z(d.getHours())+':'+z(d.getMinutes());}
function ago(iso){const m=(Date.now()-new Date(iso))/6e4;if(m<1)return 'just now';if(m<60)return Math.round(m)+' min ago';const h=m/60;if(h<24)return Math.round(h)+' h ago';const d=h/24;if(d<14)return Math.round(d)+' d ago';return fd(iso.slice(0,10));}
const calDays=(a,b)=>Math.round((pY(b)-pY(a))/864e5);
function toast(t,force){if(!force&&S.viewAs){t='Preview is read-only. Click "Exit preview" to make changes.';if(S.pvT&&Date.now()-S.pvT<1500)return;S.pvT=Date.now();}const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200);}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));
const rid=()=>'x'+Math.random().toString(36).slice(2,9);
/* working time: Mon–Fri 11:30–20:30 Singapore time (holidays excluded); 1 day = 9h */
const WS=11.5*36e5,WE=20.5*36e5;
const DAYH=9,SG=8*36e5;
const isOff=ds=>{const d=new Date(ds+SG);const k=d.toISOString().slice(0,10);if(S.holidays&&S.holidays[k])return true;if(S.workdays&&S.workdays[k])return false;const wd=d.getUTCDay();return wd===0||(wd===6&&!S.satWork);};
const offDay=k=>isOff(T(k+'T00:00:00+08:00'));
function workMs(a,b){if(!(b>a))return 0;let t=0;const d=new Date(a+SG);let ds=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-SG;
  while(ds<b){if(!isOff(ds)){const s=Math.max(a,ds+WS),e=Math.min(b,ds+WE);if(e>s)t+=e-s;}ds+=864e5;}return t;}
function addWork(a,hours){let left=hours*36e5;const d=new Date(a+SG);let ds=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-SG;let cur=a;
  for(let i=0;i<4000;i++){if(!isOff(ds)){const s=Math.max(cur,ds+WS),e=ds+WE;if(e>s){if(e-s>=left)return s+left;left-=e-s;}}ds+=864e5;cur=ds;}return cur;}
function fmtW(ms){const m=Math.round(ms/6e4);if(m<60)return m+'m';const h=Math.floor(m/60),mm=m%60;if(h<DAYH)return h+'h'+(mm?' '+mm+'m':'');const d=Math.floor(h/DAYH),hh=h%DAYH;return d+'d'+(hh?' '+hh+'h':'');}
const fmtH=h=>{h=+h||0;return h>=DAYH?(Math.floor(h/DAYH)+'d'+(h%DAYH?' '+(+(h%DAYH).toFixed(1))+'h':'')):(+h.toFixed(1))+'h';};

/* ============ state ============ */
const S={holidays:{},prefs:{},calMonth:null,calSel:null,profileName:null,notifOpen:false,email:null,domain:'zenwice.com',allowed:true,time:{},perfDays:7,repPid:null,charts:[],me:null,role:'MEMBER',tasks:new Map(),done:{},doneLoaded:false,teamLoaded:false,canEditShare:false,tf:{pid:'all',who:'all',st:'open'},search:null,db:null,user:null,uid:null,canWrite:true,isLead:false,projects:new Map(),team:[],template:null,tplLog:[],loaded:false,offline:false,
  view:ls.get('zw3.view')||'',pid:ls.get('zw2.pid')||null,filter:'all',q:'',hideNA:true,drawer:null,modal:null,names:{},ed:null};
const tpl=()=>S.template||DEFAULT_FLOW;

/* ============ who is signed in, what they may see ============ */
const NAV={LEAD:[['portfolio','Dashboard'],['crm','Clients'],['sprint','Sprint board'],['project','Projects'],['forecast','Forecast & map'],['daily','Daily & performance'],['people','People & team'],['calendar','Calendar'],['process','Process']],
  MGR:[['mywork','My work'],['sprint','Sprint board'],['portfolio','Dashboard'],['crm','Clients'],['project','Projects'],['forecast','Forecast & map'],['daily','Daily & performance'],['calendar','Calendar']],
  MEMBER:[['mywork','My work'],['profile','My profile'],['project','Projects'],['map','Project map'],['calendar','Calendar']]};
/* tabs that hold several views; switch between them inside the page */
const GROUPS={sprint:[['sprint','Board'],['tasks','Task list']],forecast:[['forecast','Forecast'],['map','Project map'],['clients','Client reports']],daily:[['daily','Daily report'],['perf','Performance']],people:[['people','People'],['team','Team',1]]};
const groupOf=v=>Object.keys(GROUPS).find(g=>GROUPS[g].some(x=>x[0]===v))||null;
const groupItems=g=>(GROUPS[g]||[]).filter(x=>!x[2]||S.isLead);
function navViews(){const out=[];for(const [v] of NAV[S.role]){out.push(v);if(GROUPS[v])groupItems(v).forEach(x=>out.push(x[0]));}return out;}
function subSwitch(){const g=groupOf(S.view);if(!g||!NAV[S.role].some(x=>x[0]===g))return '';const it=groupItems(g);if(it.length<2)return '';
  return `<div class="segwrap"><div class="seg" role="tablist">${it.map(([v,l])=>`<button role="tab" data-act="tab" data-v="${v}" aria-selected="${v===S.view}">${ico(v)}<span>${l}</span></button>`).join('')}</div></div>`;}
const ROLE_LABEL={LEAD:'Lead',MGR:'Manager',MEMBER:'Team member'};
const LEVELS=[['intern','Intern'],['employee','Employee'],['manager','Manager'],['lead','Lead'],['super','Super admin']];
const levelOf=m=>m?.level||((m?.roles||[]).includes('LEAD')?'lead':(m?.roles||[]).includes('MGR')?'manager':'employee');
const LVL_LABEL=Object.fromEntries(LEVELS);
function computeMe(){const dom=(S.domain||'zenwice.com').toLowerCase().replace(/^@/,'');S.allowed=true;
  if(S.trueUid!==undefined){const pv=S.trueOwner&&S.viewAs?S.team.find(x=>x.name===S.viewAs):null;if(S.viewAs&&!pv)S.viewAs=null;S.uid=pv?(pv.uid||'preview:'+pv.name):S.trueUid;S.isOwner=pv?false:S.trueOwner;if(pv)S.canEditShare=['manager','lead','super'].includes(levelOf(pv));else S.canEditShare=S.trueCanEdit;}
  const m=S.team.find(x=>x.uid&&x.uid===S.uid)||(S.viewAs&&S.trueOwner?S.team.find(x=>x.name===S.viewAs):null)||null;S.me=m;const lv=S.isOwner?'super':levelOf(m);S.level=lv;S.isLead=S.isOwner||lv==='lead'||lv==='super';S.role=S.isLead?'LEAD':lv==='manager'?'MGR':'MEMBER';
  const allowed=navViews();if(S.viewAuto===undefined)S.viewAuto=!S.view;if((!allowed.includes(S.view)&&!(S.view==='profile'&&(S.isLead||isMgr())))||S.viewAuto)S.view=allowed[0];if(S.db&&S.viewAuto)S.viewAuto=false;}
const myName=()=>S.me?.name||(S.isOwner?(S.team.find(x=>(x.roles||[]).includes('LEAD'))?.name||'Lead'):'');
const isMgr=()=>S.role==='MGR';
function myProjects(){const all=[...S.projects.values()];if(S.isLead)return all;const n=myName();if(!n)return [];
  return all.filter(p=>Object.values(p.roles||{}).includes(n)||[...S.tasks.values()].some(t=>t.pid===p.code&&t.assigneeUid&&t.assigneeUid===S.uid));}
function canManage(p){if(S.isLead)return true;if(!isMgr()||!p)return false;return Object.values(p.roles||{}).includes(myName());}
function canActLevel(p,l){return canManage(p)||(!!myName()&&who(p,l)===myName());}
/* tasks */

/* visits: one per pass at a level, timed in working hours minus pauses */
function visitsOf(p,s,ctx){
  const st=stOf(p,s.id);const log=sortLog(st);const out=[];const n=s.chain.length;const now=Date.now();

      else if(e.ev==='return'){close(t,'returned');cur={lv:e.to,from:t};}}
    if(cur){cur.to=now;cur.live=true;out.push(cur);}
  }else if(s.mode==='all'){let t0=null,clicked={};
    for(const e of log){const t=T(e.at);
      if(e.ev==='start'||e.ev==='reopen'){if(e.ev==='reopen'&&t0!=null){/* close open levels as returned */ s.chain.forEach((_,i)=>{if(!clicked[i])out.push({lv:i,from:t0,to:t,outcome:'returned'});});}t0=t;clicked={};}
      else if(e.ev==='click'&&t0!=null&&!clicked[e.lv]){clicked[e.lv]=1;out.push({lv:e.lv,from:t0,to:t,outcome:'passed'});}}
    if(t0!=null)s.chain.forEach((_,i)=>{if(!clicked[i])out.push({lv:i,from:t0,to:now,live:true});});
  }else if(s.mode==='meeting'){const str=streamsOf(p,ctx);if(str.length&&str.every(x=>statusOf(p,x,ctx)==='dn')){

}
/* who has to act now */
function dutiesOf(p,s,ctx,status){
  if(status==='dn'||status==='na')return [];const st=stOf(p,s.id);
  if(s.mode==='seq'){const i=typeof st.level==='number'?st.level:0;return [{i,l:s.chain[i]}];}
  if(s.mode==='all'){const c=st.clicks||{};return s.chain.map((l,i)=>({i,l})).filter(x=>!c[x.i]);}

}
function planH(p,flow,remaining){let tot=0;for(const ph of flow.phases)for(const g of ph.groups){
    const ctxs=g.steps.map(s=>({s,g})).filter(c=>appl(p,c.s));const hOf=c=>{if(remaining&&statusOf(p,c.s,c)==='dn')return 0;const hs=c.s.chain.map(l=>+l.h||0);return c.s.mode==='all'?Math.max(0,...hs):hs.reduce((a,b)=>a+b,0);};
    if(g.par){const non=ctxs.filter(c=>c.s.mode!=='meeting'),mt=ctxs.filter(c=>c.s.mode==='meeting');tot+=Math.max(0,...non.map(hOf))+mt.reduce((a,c)=>a+hOf(c),0);}
    else tot+=ctxs.reduce((a,c)=>a+hOf(c),0);}return tot;}
const DEFAULT_DAYS=[5,8,10,20];
function phaseTiming(p,m,pi){const rows=m.app.filter(r=>r.pi===pi);const ideal=(+m.flow.phases[pi].days||DEFAULT_DAYS[pi]||5)*DAYH*36e5;
  let start=null;for(const r of rows)for(const e of stOf(p,r.s.id).log||[]){const t=T(e.at);if(start==null||t<start)start=t;}
  const done=rows.length&&rows.every(r=>r.status==='dn');const end=done?Math.max(...rows.map(r=>T(stOf(p,r.s.id).doneAt||0))):null;
  const ms=start!=null?workMs(start,end||Date.now()):0;return {start,end,done,ms,ideal,over:start!=null&&ms>ideal,expEnd:start!=null?addWork(start,ideal/36e5):null,days:ideal/36e5/DAYH};}
const rawItem=t=>t.assigneeUid?S.done[t.assigneeUid]?.items?.[t.id]:null;
const revCount=t=>(t.log||[]).filter(e=>e.kind==='revision'||/sent back/i.test(e.txt||'')).length;
function taskTiming(t){const it=rawItem(t);const lim=(+(t.v2?.allowedH||t.hours)||0)*36e5;
  if(it&&(it.rounds||it.startedAt)){const rounds=(it.rounds||[]).map(r=>({...r,ms:workMs(T(r.start),T(r.end))}));let ms=rounds.reduce((a,r)=>a+r.ms,0);const live=it.s==='doing'&&it.startedAt?T(it.startedAt):null;if(live)ms+=workMs(live,Date.now());
    const start=rounds[0]?T(rounds[0].start):live;const end=it.s==='done'?T(it.at):null;return {start,end,ms,lim,over:lim>0&&ms>lim,rounds,live,revisions:revCount(t)};}
  return legacyTiming(t,lim);}

  const st=hist.find(x=>afterRe(x)&&(x.s==='doing'||x.s==='done'));const start=st?T(st.at):null;const end=rec&&rec.s==='done'?T(rec.at):null;

let MC=new WeakMap();
function metrics(p){
  if(MC.has(p))return MC.get(p);
  const flow=p.flow||tpl();const lab=labelOf(flow);const all=stepsOf(flow);const t=today();
  const rows=all.map(c=>{const status=statusOf(p,c.s,c);return {...c,status,label:lab[c.s.id],vis:visitsOf(p,c.s,c)};});
  const app=rows.filter(r=>r.status!=='na');const done=app.filter(r=>r.status==='dn');
  // open steps: groups in order; a parallel group opens all its streams together, a meeting opens when its streams are done
  const open=new Set();let blocked=false;
  for(const ph of flow.phases)for(const g of ph.groups){const gr=app.filter(r=>r.g===g);if(!gr.length)continue;
    if(blocked){gr.forEach(r=>{if(r.status!=='dn'&&r.status!=='ns')open.add(r.s.id);});continue;}
    if(g.par){gr.forEach(r=>{if(r.status!=='dn'&&(r.s.mode!=='meeting'||r.status==='wi'))open.add(r.s.id);});if(gr.some(r=>r.status!=='dn'))blocked=true;}
    else{for(const r of gr){if(r.status!=='dn'){open.add(r.s.id);blocked=true;break;}}}}
  const current=app.filter(r=>open.has(r.s.id));
  const duties=[];for(const r of current)for(const d of dutiesOf(p,r.s,r,r.status)){const live=r.vis.find(v=>v.live&&v.lv===d.i);duties.push({r,i:d.i,l:d.l,person:who(p,d.l),live});}
  const over=duties.filter(d=>d.live&&d.live.over&&!stOf(p,d.r.s.id).hold);
  const breaches=app.reduce((a,r)=>a+r.vis.filter(v=>v.over).length,0);

  const pct=app.length?Math.round(done.length/app.length*100):0;
  const phases=flow.phases.map((ph,pi)=>{const a=app.filter(r=>r.pi===pi);const d=a.filter(r=>r.status==='dn');return {k:ph.k,name:ph.name,total:a.length,done:d.length,pct:a.length?Math.round(d.length/a.length*100):100};});
  const phase=current[0]?flow.phases[current[0].pi]:null;
  const startMs=p.start?T(p.start+'T11:30:00+08:00'):Date.now();
  const planEnd=addWork(startMs,planH(p,flow,false));const remH=planH(p,flow,true);const fc=remH?addWork(Math.max(Date.now(),startMs),remH):null;

  const lateBy=p.target&&fc?Math.round(workMs(T(p.target+'T20:30:00+08:00'),fc)/36e5/DAYH*2)/2:0;
  let status;if(p.state&&p.state!=='Active')status=p.state;else if(app.length&&pct===100)status='Completed';else if(blockedR.length)status='Blocked';else if(waitC.length)status='Waiting on client';else if(review.length)status='In review';else if(!done.length&&!current.some(r=>r.status!=='ns'))status='Not started';else status='In progress';
  const health=over.length?'late':lateBy>0?'risk':'ok';

  MC.set(p,m);return m;
}
const ST={ns:'Not started',ip:'Working',wi:'In review',wc:'Waiting on client',bl:'Blocked',dn:'Done',na:'Not applicable'};
const statusClass=st=>({'Blocked':'s-bl','Waiting on client':'s-wc','In review':'s-wi','In progress':'s-ip','Completed':'s-dn','Closed – Lost':'s-na'}[st]||'');

function chainHTML(p,r){const st=stOf(p,r.s.id);const sep=r.s.mode==='all'?'+':'→';
  const cells=r.s.chain.map((l,i)=>{const vs=r.vis.filter(v=>v.lv===i);const over=vs.some(v=>v.over);

const queues={};
function enqueue(k,fn){const pr=(queues[k]||Promise.resolve()).then(fn,fn);queues[k]=pr.catch(()=>{});return pr;}
function writeErr(e){if(e&&e.code==='preview'){toast('');return;}console.error(e);toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete old projects to add more.':e&&e.code==='invalid_argument'?'You do not have access to change this.':'Could not save. Try again.');}

/* one step action */
function act(pid,sid,a,d){
  if(!S.db)return;
  return enqueue(pid,async()=>{
    const p=S.projects.get(pid);if(!p)return;const m=metrics(p);const r=m.rows.find(x=>x.s.id===sid);if(!r)return;const s=r.s;
    const now=new Date().toISOString();const st=clone(p.steps?.[sid]||{});st.log=st.log||[];const n=s.chain.length;
    const e={ev:a,at:now,by:S.uid||null};if(d.link)e.link=d.link;if(d.comment)e.comment=d.comment;if(d.kpis)e.kpis=d.kpis;if(d.kt)e.kt=d.kt;if(d.evidence)e.evidence=d.evidence;
    const writes={};
    if(a==='na'||a==='applicable'){st.na=a==='na';}
    else if(s.mode==='seq'){const i=typeof st.level==='number'?st.level:null;
      if(a==='start'){if(st.level!=null)return;st.level=0;st.startedAt=now;}
      else if(a==='submit'||a==='approve'){if(i==null)return;e.lv=i;st.level=i+1<n?i+1:'done';if(d.link)st.link=d.link;if(st.level==='done')st.doneAt=now;}
      else if(a==='return'){e.lv=i==null?n-1:i;e.to=d.to;st.level=d.to;st.doneAt=null;st.hold=null;}
      else if(a==='hold'){e.lv=i;e.s=d.s;st.hold={s:d.s,reason:d.comment,at:now};}
      else if(a==='resume'){e.lv=i;st.hold=null;}
    }else if(s.mode==='all'){
      if(a==='start'){st.started=now;st.startedAt=st.startedAt||now;st.clicks={};}
      else if(a==='click'){if(st.started==null){st.started=now;st.startedAt=now;st.log.push({ev:'start',at:now,by:S.uid||null});}e.lv=d.lv;st.clicks=st.clicks||{};st.clicks[d.lv]={at:now,by:S.uid||null};if(d.link)st.link=d.link;if(s.chain.every((_,k)=>st.clicks[k]))st.doneAt=now;}
      else if(a==='reopen'){st.started=now;st.clicks={};st.doneAt=null;}
      else if(a==='hold'){e.s=d.s;st.hold={s:d.s,reason:d.comment,at:now};}
      else if(a==='resume'){st.hold=null;}
    }else if(s.mode==='meeting'){
      if(a==='complete'){e.date=d.date;st.done=true;st.doneAt=now;st.meetingDate=d.date||today();st.notes=d.comment||'';}
      else if(a==='sendback'){const tgt=m.rows.find(x=>x.s.id===d.stream);if(!tgt)return;const ts=clone(p.steps?.[d.stream]||{});ts.log=ts.log||[];
        ts.log.push({ev:'return',at:now,by:S.uid||null,lv:tgt.s.chain.length-1,to:d.to,comment:'Joint meeting: '+(d.comment||'')});ts.level=d.to;ts.doneAt=null;ts.hold=null;ts.updatedAt=now;writes[d.stream]=ts;
        e.stream=m.lab[d.stream];e.toLv=tgt.s.chain[d.to]?.lv;st.done=false;st.doneAt=null;}
      else if(a==='reopen'){st.done=false;st.doneAt=null;}
    }
    st.log.push(e);st.updatedAt=now;writes[sid]=st;
    for(const k in writes)for(const f in writes[k])if(writes[k][f]===undefined)writes[k][f]=null;
    await S.db.doc('wf_projects/'+pid).update({steps:writes,updatedAt:now});
  }).catch(writeErr);
}
async function saveProject(id,data,isNew){

    else await enqueue(id,()=>S.db.doc('wf_projects/'+id).update({...data,updatedAt:now}));

}

function mergeFlow(tplFlow,p){const nf=clone(tplFlow);const have=new Set(stepsOf(nf).map(x=>x.s.id));const old=p.flow||tplFlow;
  for(const x of stepsOf(old)){if(have.has(x.s.id))continue;if(!(stOf(p,x.s.id).log||[]).length)continue;const ph=nf.phases[x.pi];if(!ph)continue;let g=ph.groups.find(gg=>gg.id===x.g.id);if(!g){g=ph.groups[ph.groups.length-1];if(!g){g={id:x.g.id,name:x.g.name,par:x.g.par,steps:[]};ph.groups.push(g);}}g.steps.push(clone(x.s));}
  return nf;}
function stepStarted(p,s){if(!p)return false;return (stOf(p,s.id).log||[]).length>0;}
function edAt(path){const [pi,gi,si,li]=path.split('.').map(Number);const ph=S.ed.flow.phases[pi];const g=ph?.groups[gi];const s=g?.steps[si];return {pi,gi,si,li,ph,g,s,l:s?.chain[li]};}
function diffFlows(a,b){const out=[];const A=Object.fromEntries(stepsOf(a).map(x=>[x.s.id,x])),B=Object.fromEntries(stepsOf(b).map(x=>[x.s.id,x]));
  for(const id in B)if(!A[id])out.push(`Added step "${B[id].s.name}" to ${B[id].ph.name} / ${B[id].g.name}`);
  for(const id in A)if(!B[id])out.push(`Deleted step "${A[id].s.name}"`);
  for(const id in B){const x=A[id],y=B[id];if(!x)continue;
    if(x.s.name!==y.s.name)out.push(`Renamed "${x.s.name}" to "${y.s.name}"`);
    if(x.s.mode!==y.s.mode)out.push(`"${y.s.name}": chain ${MODES[x.s.mode]} → ${MODES[y.s.mode]}`);
    if(x.s.scope!==y.s.scope)out.push(`"${y.s.name}": applies ${x.s.scope} → ${y.s.scope}`);
    if((x.s.kpis||[]).join('|')!==(y.s.kpis||[]).join('|'))out.push(`"${y.s.name}": KPIs updated (${(y.s.kpis||[]).length})`);
    const ca=x.s.chain.map(l=>`${lvLabel(l)} ${l.h}h`).join(', '),cb=y.s.chain.map(l=>`${lvLabel(l)} ${l.h}h`).join(', ');if(ca!==cb)out.push(`"${y.s.name}": ${ca} → ${cb}`);
    if(x.gi!==y.gi||x.si!==y.si||x.pi!==y.pi)out.push(`Moved "${y.s.name}"`);}
  a.phases.forEach((ph,i)=>{const nb=b.phases[i];if(nb&&(+ph.days||DEFAULT_DAYS[i])!==(+nb.days||DEFAULT_DAYS[i]))out.push(`${nb.name}: ideal timeframe ${ph.days||DEFAULT_DAYS[i]}d → ${nb.days}d`);});
  const gA=a.phases.flatMap(ph=>ph.groups.map(g=>[g.id,g])),gB=Object.fromEntries(b.phases.flatMap(ph=>ph.groups.map(g=>[g.id,g])));
  for(const [id,g] of gA){const y=gB[id];if(!y)out.push(`Deleted group "${g.name}"`);else{if(y.name!==g.name)out.push(`Renamed group "${g.name}" to "${y.name}"`);if(!!y.par!==!!g.par)out.push(`Group "${y.name}": ${y.par?'now parallel':'now in order'}`);}}
  const gAids=new Set(gA.map(x=>x[0]));for(const id in gB)if(!gAids.has(id))out.push(`Added group "${gB[id].name}"`);
  return [...new Set(out)].slice(0,30);}
function edValidate(flow){for(const ph of flow.phases)if(!(+ph.days>0))return `${ph.name}: set an ideal timeframe above 0 days.`;for(const ph of flow.phases)for(const g of ph.groups){if(!g.name.trim())return 'Every group needs a name.';for(const s of g.steps){if(!s.name.trim())return 'Every step needs a name.';if(!s.chain.length)return `"${s.name}" needs at least one level.`;if(s.chain.some(l=>!(+l.h>0)))return `"${s.name}": every level needs an hour limit above 0.`;if(s.mode==='meeting'&&!g.par)return `"${s.name}": a joint meeting only works inside a parallel group.`;}}return null;}

  const n=myName();if(n)for(const p of myProjects()){const m=metrics(p);for(const d of m.duties)if(d.person===n){const st=stOf(p,d.r.s.id);const last=(st.log||[]).slice(-1)[0];add(last?.at||p.createdAt,`Your turn: ${d.r.s.name} (${d.l.lv}) · ${p.client}`,'step',`data-pid="${esc(p.code)}" data-sid="${d.r.s.id}"`,'step');}}
  {const k=dayKey(Date.now());const su=S.time[S.uid]?.days?.[k]?.standups||{};const nowH=((Date.now()+SG)%864e5)/36e5;if(S.uid&&!offDay(k))for(const [id,label,hr] of STANDUPS)if(nowH>=hr&&!su[id])add(new Date(Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8))-SG+hr*36e5).toISOString(),`Stand-up at ${label}: did you join? Mark it on My work`,'tab','data-v="'+(S.role==='LEAD'?'portfolio':'mywork')+'"','rev');}

  return out.sort((a,b)=>a.at<b.at?1:-1).slice(0,40);}

/* ============ load-aware forecast ============ */
function remainH(t){const tt=taskTiming(t);const h=+t.hours||4;return Math.max(0.5,h-tt.ms/36e5);}
function loadOf(name){const items=[];const projs=new Set();for(const p of myProjects()){const m=metrics(p);if(['Completed','Closed – Lost','On Hold'].includes(m.status))continue;for(const d of m.duties)if(d.person===name){const rem=Math.max(0.5,(+d.l.h||0)-(d.live?d.live.ms/36e5:0));items.push({kind:'step',p,label:`${p.client}: ${d.r.s.name} (${d.l.lv})`,h:rem});projs.add(p.code);}}
  for(const t of S.tasks.values())if(t.assignee===name&&['todo','doing'].includes(taskStatus(t))){items.push({kind:'task',label:t.title,h:remainH(t),t});if(t.pid)projs.add(t.pid);}
  const hours=items.reduce((a,x)=>a+x.h,0);return {items,hours,projects:projs.size,days:hours/DAYH,clear:addWork(Date.now(),hours)};}

  const prow=list.map(p=>{const m=metrics(p);const remH=planH(p,m.flow,true);const ds=m.duties;const owners=[...new Set(ds.map(d=>d.person))];
    const back=Math.max(0,...owners.map(o=>{const L=loads[o];if(!L)return 0;const own=L.items.filter(x=>x.kind==='step'&&x.p===p).reduce((a,x)=>a+x.h,0);return L.hours-own;}));
    const eta=addWork(Date.now(),remH+back);const late=p.target&&eta>T(p.target+'T20:30:00+08:00');
    return `<tr class="click" data-act="open" data-pid="${esc(p.code)}"><td><b>${esc(p.client)}</b><div class="why">${esc(p.code)} · ${m.pct}%</div></td><td>${m.phase?`<span class="mono">${m.phase.k}</span> ${esc(m.phase.name)}`:'—'}<div class="why">${ds.slice(0,2).map(d=>esc(d.r.s.name)).join(', ')}</div></td><td>${owners.map(o=>`<div>${esc(o)} <span class="muted">· ${loads[o]?loads[o].projects+' projects, '+fmtH(loads[o].hours)+' queued':''}</span></div>`).join('')||'—'}</td><td class="mono">${fmtH(remH)}<div class="why">${(remH/DAYH).toFixed(1)} working days</div></td><td class="mono">${back?fmtH(back):'—'}</td><td class="mono ${late?'late':''}">${fd(eta)}<div class="why">${((remH+back)/DAYH).toFixed(1)} days at 9h/day${late?' · after deadline '+fd(p.target):''}</div></td></tr>`;}).join('');
  const sel=list.find(p=>p.code===S.fcPid)||list[0];let steps='';
  if(sel){const m=metrics(sel);let cum=0;const rows=[];for(const ph of m.flow.phases)for(const g of ph.groups){const gr=m.app.filter(r=>r.g===g&&r.status!=='dn');if(!gr.length)continue;
      const hOf=r=>{const live=r.vis.find(v=>v.live);const hs=r.s.chain.map((l,i)=>{const vs=r.vis.filter(v=>v.lv===i);const used=live&&live.lv===i?live.ms/36e5:0;return Math.max(0,(+l.h||0)-used);});return r.s.mode==='all'?Math.max(0,...hs):hs.reduce((a,b)=>a+b,0);};
      const start=cum;let gmax=0;for(const r of gr){const hh=hOf(r);const end=g.par&&r.s.mode!=='meeting'?start+hh:cum+hh;if(!g.par||r.s.mode==='meeting')cum+=hh;else gmax=Math.max(gmax,hh);const own=[...new Set(r.s.chain.map(l=>who(sel,l)))];const L=own.map(o=>loads[o]).filter(Boolean);
        rows.push(`<tr class="click" data-act="step" data-pid="${esc(sel.code)}" data-sid="${r.s.id}"><td><span class="mono">${m.lab[r.s.id]}</span> ${esc(r.s.name)}${m.current.includes(r)?' <span class="pill s-ip">now</span>':''}</td><td>${own.map(o=>`${esc(o)} <span class="muted">(${loads[o]?loads[o].projects+' proj · '+fmtH(loads[o].hours):'—'})</span>`).join('<br>')}</td><td class="mono">${fmtH(hh)}</td><td class="mono">${fd(addWork(Date.now(),end))}</td></tr>`);}
      if(g.par)cum+=gmax;}

/* ============ report range: a day, a week, or the last N days ============ */
function rangeOf(){const g=S.rg=S.rg||{mode:'day',n:7,end:today()};const end=g.end||today();const ms=T(end+'T12:00:00+08:00');let days=[];
  if(g.mode==='day')days=[end];else if(g.mode==='week'){const dow=(new Date(ms+SG).getUTCDay()+6)%7;for(let i=0;i<7;i++)days.push(dayKey(ms-(dow-i)*864e5));}else{const n=Math.max(1,Math.min(365,+g.n||7));for(let i=n-1;i>=0;i--)days.push(dayKey(ms-i*864e5));}
  const d0=T(days[0]+'T00:00:00+08:00'),d1=T(days[days.length-1]+'T00:00:00+08:00')+864e5;const work=days.filter(d=>!S.holidays[d]&&!isOff(T(d+'T00:00:00+08:00')));
  const label=g.mode==='day'?fd(end):`${fd(days[0])} – ${fd(days[days.length-1])}`;return {mode:g.mode,days,d0,d1,work,label,end};}
function lastRange(n){const days=lastDays(n);return {days,d0:T(days[0]+'T00:00:00+08:00'),d1:T(days[n-1]+'T00:00:00+08:00')+864e5,work:days.filter(d=>!S.holidays[d]&&!isOff(T(d+'T00:00:00+08:00')))};}
function rangeBar(){const g=S.rg=S.rg||{mode:'day',n:7,end:today()};const R=rangeOf();

  ${g.mode==='days'?`<label class="edchk" for="rgN" style="color:var(--fg)">Last</label><input type="number" id="rgN" class="btn small" min="1" max="365" value="${esc(g.n)}" style="width:72px"><span class="muted">days up to</span>`:`<span class="muted">${g.mode==='week'?'Week of':'Day'}</span>`}
  <input type="date" id="rgEnd" class="btn small" value="${esc(g.end||today())}"><button class="btn small" data-act="rg-shift" data-v="-1" aria-label="Earlier">←</button><button class="btn small" data-act="rg-shift" data-v="1" aria-label="Later">→</button>${g.end!==today()?`<button class="btn small ghost" data-act="rg-today">Today</button>`:''}

/* ============ daily report ============ */
function overlapMs(a,b,d0,d1){return workMs(Math.max(a,d0),Math.min(b,d1));}
function vDaily(){const Rg=rangeOf();const d0=Rg.d0,d1=Rg.d1;const one=Rg.days.length===1;const day=Rg.days[0];const ms=members();
  const rows=ms.map(m=>{const ts=[...S.tasks.values()].filter(t=>t.assignee===m.name);
    let taskMs=0;const worked=[],submitted=[],closed=[];for(const t of ts){const it=rawItem(t);let w=0;for(const r of it?.rounds||[])w+=overlapMs(T(r.start),T(r.end),d0,d1);if(it?.s==='doing'&&it.startedAt)w+=overlapMs(T(it.startedAt),Date.now(),d0,d1);if(w>0){taskMs+=w;worked.push({t,w});}
      if((it?.rounds||[]).some(r=>T(r.end)>=d0&&T(r.end)<d1))submitted.push(t);const va=taskVerifiedAt(t);if(va&&T(va)>=d0&&T(va)<d1)closed.push(t);}

    const dd=m.uid?Rg.days.map(d=>S.time[m.uid]?.days?.[d]).filter(Boolean):[];const present=dd.filter(x=>x.start).length;
    const avgStart=present?(()=>{const mins=dd.filter(x=>x.start).map(x=>((T(x.start)+SG)%864e5)/6e4);const a=Math.round(mins.reduce((s,v)=>s+v,0)/mins.length);return z(Math.floor(a/60))+':'+z(a%60);})():'—';
    const su=k=>dd.filter(x=>x.standups?.[k]?.v).length;
    return {m,dd:m.uid?S.time[m.uid]?.days?.[day]||{}:{},present,avgStart,am:su('am'),pm:su('pm'),worked,submitted,closed,taskMs,stepMs,stepN,stepOver,ideal,act,hrs:m.uid?Rg.days.reduce((a,d)=>a+hoursOn(m.uid,d),0):0};});
  const tot=rows.reduce((a,x)=>({hrs:a.hrs+x.hrs,sub:a.sub+x.submitted.length,cl:a.cl+x.closed.length,st:a.st+x.stepN}),{hrs:0,sub:0,cl:0,st:0});

   <td class="mono">${one?`${hm(x.dd.start)}–${hm(x.dd.end)}${(x.dd.breaks||[]).length?`<div class="why">breaks ${fmtW((x.dd.breaks||[]).reduce((a,b)=>a+Math.max(0,T(b.to||new Date().toISOString())-T(b.from)),0))}</div>`:''}`:`${x.present}/${Rg.work.length}<div class="why">avg start ${x.avgStart}</div>`}</td>

   <td class="mono ${x.m.uid&&expH&&x.hrs<expH*0.8&&!one?'late':''}">${fmtHrs(x.hrs)}${!one&&expH?`<div class="why">of ${fmtH(expH)} expected</div>`:''}</td><td class="mono">${x.taskMs?fmtW(x.taskMs):'—'}</td><td class="mono">${x.stepMs?fmtW(x.stepMs):'—'}<div class="why">${x.stepN} level${x.stepN===1?'':'s'} passed${x.stepOver?`, <span class="late">${x.stepOver} late</span>`:''}</div></td><td class="mono">${x.submitted.length}</td><td class="mono">${x.closed.length}</td><td class="mono ${x.ideal&&x.act>x.ideal?'late':''}">${x.ideal?`${fmtH(x.ideal)} vs ${fmtH(+x.act.toFixed(2))}`:'—'}</td></tr>

function mySprintCard(){const ts=[...S.tasks.values()].filter(t=>t.createdBy===S.uid&&t.assigneeUid!==S.uid);if(!ts.length)return '';const by={};for(const t of ts)if(taskStatus(t)!=='done')(by[t.assignee]=by[t.assignee]||[]).push(t);

function stepCol(p,m,r){const st=stOf(p,r.s.id);if(r.status==='ns')return 'todo';
  if(r.s.mode==='meeting')return r.status==='wi'?'c3':'todo';
  if(r.s.mode==='seq'){const i=typeof st.level==='number'?st.level:null;if(i==null)return 'todo';const lv=r.s.chain[i]?.lv;return lv==='C2'?'c2':lv==='C3'?'c3':'doing';}
  const ds=m.duties.filter(d=>d.r===r);const lvs=ds.map(d=>d.l.lv);if(lvs.some(l=>l==='C1'||l==='BA'))return 'doing';if(lvs.includes('C2'))return 'c2';if(lvs.includes('C3'))return 'c3';return 'doing';}
function boardItems(mon,sun){const items=[];
  for(const p of myProjects()){const m=metrics(p);if(['Closed – Lost','On Hold'].includes(m.status))continue;
    for(const r of m.current){const col=stepCol(p,m,r);const ds=m.duties.filter(d=>d.r===r);const people=[...new Set((ds.length?ds:[{person:who(p,r.s.chain[0]),l:r.s.chain[0]}]).map(d=>d.person))];
      const live=ds.map(d=>d.live).find(Boolean);const lvL=ds[0]?.l||r.s.chain[0];
      items.push({kind:'step',col,p,r,title:r.s.name,label:m.lab[r.s.id],people,lv:lvL.lv,ms:live?live.ms:0,lim:live?live.lim:(+lvL.h||0)*36e5,over:!!live?.over,hold:stOf(p,r.s.id).hold,phase:m.flow.phases[r.pi]?.k});}
    for(const r of m.app)if(r.status==='dn'){const da=stOf(p,r.s.id).doneAt;if(da&&T(da)>=mon&&T(da)<sun)items.push({kind:'step',col:'done',p,r,title:r.s.name,label:m.lab[r.s.id],people:[...new Set(r.s.chain.map(l=>who(p,l)))],lv:'',ms:r.vis.reduce((a,v)=>a+v.ms,0),lim:0,over:r.vis.some(v=>v.over),phase:m.flow.phases[r.pi]?.k});}}
  for(const t of visibleTasks()){const st=taskStatus(t);if(st==='done'){const va=taskVerifiedAt(t);if(!(va&&T(va)>=mon&&T(va)<sun))continue;}
    const tt=taskTiming(t);items.push({kind:'task',col:st,t,p:S.projects.get(t.pid),title:t.title,people:[t.assignee],ms:tt.ms,lim:(+(t.v2?.allowedH||t.hours)||0)*36e5,over:tt.over||taskLate(t)});}
  return items;}
function vSprint(){const wk=S.sprintWk||0;const now=new Date(Date.now()+SG);const dow=(now.getUTCDay()+6)%7;const mon=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()-dow+wk*7)-SG;const sun=mon+7*864e5;
  const F=S.spF=S.spF||{kind:'all',pid:'all',who:'all'};let it=boardItems(mon,sun);
  const ppl=[...new Set(it.flatMap(x=>x.people))].filter(Boolean).sort();const projs=[...new Set(it.map(x=>x.p).filter(Boolean))];
  it=it.filter(x=>(F.kind==='all'||x.kind===F.kind)&&(F.pid==='all'||(F.pid==='general'?!x.p:x.p?.code===F.pid))&&(F.who==='all'||x.people.includes(F.who)));

  const PRI={High:['High','pr-h'],Normal:['Normal','pr-n'],Low:['Low','pr-l']};const card=x=>{const cls=x.over?'klate':'';const pr=x.p?esc(x.p.client):'General';

  const cells=[];for(let i=0;i<startOff;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(`${y}-${z(mo)}-${z(d)}`);while(cells.length%7)cells.push(null);

}

/* ============ people + profiles ============ */
function profileStats(m){const uid=m.uid;const now=Date.now();const wk=now-7*864e5;const ts=[...S.tasks.values()].filter(t=>t.assignee===m.name);
  const ver=ts.filter(t=>taskVerifiedAt(t)||t.v2);let allow=0,act=0,met=0,tot=0;for(const t of ver){if(t.v2){const tt=taskTiming(t);if(t.v2.allowedH&&tt.ms){allow+=t.v2.allowedH*36e5;act+=tt.ms;}met+=t.v2.met||0;tot+=t.v2.total||0;}}
  const days30=lastDays(30);const att=uid?days30.filter(d=>S.time[uid]?.days?.[d]?.start):[];const starts=att.map(d=>{const x=new Date(T(S.time[uid].days[d].start)+SG);return x.getUTCHours()*60+x.getUTCMinutes();});
  const pd=perfData(lastRange(30)).find(x=>x.name===m.name)||{};
  return {tasks:ts.length,week:ts.filter(t=>T(t.createdAt||0)>=wk).length,open:ts.filter(t=>taskStatus(t)!=='done').length,verified:ts.filter(t=>taskStatus(t)==='done').length,waiting:ts.filter(t=>['c2','c3'].includes(taskStatus(t))).length,
    revisions:ts.reduce((a,t)=>a+revCount(t),0),eff:act?Math.round(allow/act*100):null,kpi:tot?Math.round(met/tot*100):null,metN:met,totN:tot,
    hWeek:uid?lastDays(7).reduce((a,d)=>a+hoursOn(uid,d),0):0,hMonth:uid?days30.reduce((a,d)=>a+hoursOn(uid,d),0):0,daysWorked:att.length,avgStart:starts.length?Math.round(starts.reduce((a,b)=>a+b,0)/starts.length):null,
    late:ts.filter(taskLate).length,onPct:pd.onPct??null,score:pd.score??null,ts};}
